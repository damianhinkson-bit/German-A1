 {q:"Ich möchte ___.",t:"I'd like to drink a coffee.",options:["einen Kaffee trinken","trinken einen Kaffee","einen trinken Kaffee","Kaffee einen trinken"],answer:0,say:"Ich möchte einen Kaffee trinken.",phon:"ikh MÖKH-tuh EYE-nen KA-fay TRINK-en",ex:"The infinitive goes to the very end: … einen Kaffee <b>trinken</b>."},
 {q:"Kannst du Klavier ___?",t:"Can you play piano?",options:["spielen","spielst","spielt","gespielt"],answer:0,say:"Kannst du Klavier spielen?",phon:"kannst doo kla-VEER SHPEE-len",ex:"After a modal the main verb is an infinitive at the end: <b>spielen</b>."},
 {q:"Wir wollen einen Film ___.",t:"We want to watch a film.",options:["sehen","sieht","siehst","gesehen"],answer:0,say:"Wir wollen einen Film sehen.",phon:"veer VOLL-en EYE-nen film ZAY-en",ex:"Infinitive at the end: <b>sehen</b>."},
 {q:"Ihr ___ leise sein.",t:"You (all) must be quiet.",options:["müsst","muss","müssen","musst"],answer:0,say:"Ihr müsst leise sein.",phon:"eer müsst LYE-zuh zine",ex:"<b>ihr müsst</b>."},
 {q:"___ wir tanzen?",t:"Shall we dance?",options:["Wollen","Will","Wollt","Willst"],answer:0,say:"Wollen wir tanzen?",phon:"VOLL-en veer TAN-tsen",ex:"'Wollen wir …?' = Shall we …? <b>wir wollen</b>."},
 {q:"Sie ___ sehr gut kochen.",t:"She can cook very well.",options:["kann","kannst","können","könnt"],answer:0,say:"Sie kann sehr gut kochen.",phon:"zee kann zair goot KOKH-en",ex:"3rd person singular <b>sie kann</b> — same as ich, no ending."},
 {q:"___ ich das machen?",t:"Do I have to do that?",options:["Muss","Musst","Müssen","Kann"],answer:0,say:"Muss ich das machen?",phon:"mooss ikh dass MAKH-en",ex:"<b>ich muss</b>."},
 {q:"Du ___ hier nicht rauchen.",t:"You're not allowed to smoke here.",options:["darfst","musst","kannst","sollst"],answer:0,say:"Du darfst hier nicht rauchen.",phon:"doo darfst heer nikht ROW-khen",ex:"Prohibition → <b>nicht dürfen</b>: du darfst nicht."},
 {q:"Politest way to say 'I want a beer':",t:"",options:["Ich möchte ein Bier.","Ich will ein Bier.","Ich muss ein Bier.","Ich soll ein Bier."],answer:0,say:"Ich möchte ein Bier.",phon:"ikh MÖKH-tuh eyn beer",ex:"<b>möchten</b> is the polite 'would like' — softer than 'will'."},
 {q:"Können Sie mir ___?",t:"Can you help me? (formal)",options:["helfen","hilfst","hilft","geholfen"],answer:0,say:"Können Sie mir helfen?",phon:"KÖN-en zee meer HEL-fen",ex:"Infinitive at the end, no vowel change: <b>helfen</b>."},
 {q:"Wir ___ pünktlich sein.",t:"We should be on time.",options:["sollen","soll","sollst","sollt"],answer:0,say:"Wir sollen pünktlich sein.",phon:"veer ZOLL-en PÜNKT-likh zine",ex:"<b>wir sollen</b>."},
 {q:"Meine Schwester ___ Auto fahren.",t:"My sister can drive.",options:["kann","kannst","können","könnt"],answer:0,say:"Meine Schwester kann Auto fahren.",phon:"MY-nuh SHVES-ter kann OW-toh FAH-ren",ex:"3rd person singular <b>kann</b> — no ending."},
 {q:"Ihr ___ nach Hause gehen.",t:"You (all) may go home.",options:["dürft","darf","dürfen","darfst"],answer:0,say:"Ihr dürft nach Hause gehen.",phon:"eer dürft nakh HOW-zuh GAY-en",ex:"<b>ihr dürft</b>."},
 {q:"'Ich muss gehen' means:",t:"",options:["I have to go","I want to go","I may go","I can go"],answer:0,say:"Ich muss gehen.",phon:"ikh mooss GAY-en",ex:"müssen = must / have to."}
]},
{id:"poss", title:"Possessivartikel", desc:"mein, dein, sein, ihr …", qs:[
 {q:"Das ist ___ Vater.",t:"That's my father.",options:["mein","meine","meinen","meinem"],answer:0,say:"Das ist mein Vater.",phon:"dass ist mine FAH-ter",ex:"der Vater (masc, subject) → <b>mein</b>, no ending."},
 {q:"Das ist ___ Mutter.",t:"That's my mother.",options:["meine","mein","meinen","meiner"],answer:0,say:"Das ist meine Mutter.",phon:"dass ist MY-nuh MOO-ter",ex:"die Mutter (fem) → <b>meine</b> (-e)."},
 {q:"Wo ist ___ Buch?",t:"Where is your book?",options:["dein","deine","deinen","deinem"],answer:0,say:"Wo ist dein Buch?",phon:"voh ist dine bookh",ex:"das Buch (neuter, subject) → <b>dein</b>, no ending."},
 {q:"___ Eltern sind nett.",t:"My parents are nice.",options:["Meine","Mein","Meinen","Meiner"],answer:0,say:"Meine Eltern sind nett.",phon:"MY-nuh EL-tern zint nett",ex:"Plural → <b>meine</b> (-e)."},
 {q:"Anna und ___ Bruder.",t:"Anna and her brother.",options:["ihr","sein","seine","ihre"],answer:0,say:"Anna und ihr Bruder.",phon:"AH-nah oont eer BROO-der",ex:"Anna is female → 'her' = ihr; der Bruder (masc, subject) → <b>ihr</b>, no ending."},
 {q:"Max liebt ___ Hund.",t:"Max loves his dog.",options:["seinen","sein","seine","seiner"],answer:0,say:"Max liebt seinen Hund.",phon:"maks leept ZY-nen hoont",ex:"'his' = sein; der Hund is a masculine direct object → accusative <b>seinen</b> (like einen)."},
 {q:"Das ist ___ Auto.",t:"That's her car.",options:["ihr","ihre","sein","seine"],answer:0,say:"Das ist ihr Auto.",phon:"dass ist eer OW-toh",ex:"das Auto (neuter) → <b>ihr</b>, no ending."},
 {q:"Ich sehe ___ Bruder.",t:"I see my brother.",options:["meinen","mein","meine","meinem"],answer:0,say:"Ich sehe meinen Bruder.",phon:"ikh ZAY-uh MY-nen BROO-der",ex:"Masculine direct object → <b>-en</b>: meinen — exactly like einen."},
 {q:"Hast du ___ Schlüssel?",t:"Do you have your keys?",options:["deinen","dein","deine","deinem"],answer:0,say:"Hast du deinen Schlüssel?",phon:"hast doo DINE-en SHLÜSS-el",ex:"der Schlüssel (masc) as a direct object → <b>deinen</b>."},
 {q:"___ Schwester heißt Lena.",t:"His sister is called Lena.",options:["Seine","Sein","Seinen","Ihre"],answer:0,say:"Seine Schwester heißt Lena.",phon:"ZY-nuh SHVES-ter hysst LAY-nah",ex:"'his' = sein; die Schwester (fem) → <b>seine</b>."},
 {q:"Wir lieben ___ Kinder.",t:"We love our children.",options:["unsere","unser","unseren","unserem"],answer:0,say:"Wir lieben unsere Kinder.",phon:"veer LEE-ben OON-zuh-ruh KIN-der",ex:"Plural → <b>unsere</b>."},
 {q:"Wo ist ___ Auto?",t:"Where is your (pl) car?",options:["euer","eure","euren","euerem"],answer:0,say:"Wo ist euer Auto?",phon:"voh ist OY-er OW-toh",ex:"'your' (you all) = euer; das Auto (neuter) → <b>euer</b>, no ending."},
 {q:"Sie besuchen ___ Großmutter.",t:"They visit their grandmother.",options:["ihre","ihr","ihren","seiner"],answer:0,say:"Sie besuchen ihre Großmutter.",phon:"zee buh-ZOO-khen EE-ruh GROHSS-moo-ter",ex:"'their' = ihr; die Großmutter (fem) → <b>ihre</b>."},
 {q:"Julia sucht ___ Handy.",t:"Julia is looking for her phone.",options:["ihr","sein","seine","ihren"],answer:0,say:"Julia sucht ihr Handy.",phon:"YOO-lyah zookht eer HEN-dee",ex:"Julia is female → 'her' = ihr; das Handy (neuter) → <b>ihr</b>, no ending."},
 {q:"___ Hund ist groß.",t:"My dog is big.",options:["Mein","Meine","Meinen","Meinem"],answer:0,say:"Mein Hund ist groß.",phon:"mine hoont ist grohss",ex:"der Hund (masc, subject) → <b>mein</b>, no ending."},
 {q:"Er repariert ___ Fahrrad.",t:"He's fixing his bike.",options:["sein","seine","seinen","seinem"],answer:0,say:"Er repariert sein Fahrrad.",phon:"air reh-pah-REERT zine FAHR-raht",ex:"das Fahrrad (neuter) direct object → <b>sein</b> (neuter unchanged)."},
 {q:"Das sind ___ Freunde.",t:"Those are my friends.",options:["meine","mein","meinen","meiner"],answer:0,say:"Das sind meine Freunde.",phon:"dass zint MY-nuh FROYN-duh",ex:"Plural → <b>meine</b>."},
 {q:"Kennst du ___ Vater?",t:"Do you know her father?",options:["ihren","ihr","ihre","seiner"],answer:0,say:"Kennst du ihren Vater?",phon:"kennst doo EE-ren FAH-ter",ex:"der Vater (masc) direct object → -en; 'her' = ihr → <b>ihren</b>."},
 {q:"Wo sind ___ Schuhe?",t:"Where are your shoes?",options:["deine","dein","deinen","deiner"],answer:0,say:"Wo sind deine Schuhe?",phon:"voh zint DINE-uh SHOO-uh",ex:"Plural → <b>deine</b>."},
 {q:"Ich mag ___ Lehrerin.",t:"I like my teacher.",options:["meine","mein","meinen","meiner"],answer:0,say:"Ich mag meine Lehrerin.",phon:"ikh mahk MY-nuh LAY-reh-rin",ex:"die Lehrerin (fem) direct object → <b>meine</b> (feminine unchanged)."}
]},
{id:"imp", title:"Imperativ", desc:"Commands & requests", qs:[
 {q:"___! (Come here — du)",t:"Come here!",options:["Komm","Kommst","Kommen","Kommt"],answer:0,say:"Komm!",phon:"komm",ex:"du-imperative = stem; drop -st and the pronoun: <b>Komm!</b>"},
 {q:"___ Sie bitte! (Come — formal)",t:"Please come!",options:["Kommen","Komm","Kommt","Kommst"],answer:0,say:"Kommen Sie bitte!",phon:"KOMM-en zee BIT-tuh",ex:"Sie-form = infinitive + Sie: <b>Kommen Sie!</b>"},
 {q:"___ mir! (Help me — du)",t:"Help me!",options:["Hilf","Helf","Hilfst","Helft"],answer:0,say:"Hilf mir!",phon:"hilf meer",ex:"e→i vowel change stays: helfen → <b>Hilf!</b>"},
 {q:"___ das Buch! (Read — du)",t:"Read the book!",options:["Lies","Les","Liest","Lest"],answer:0,say:"Lies das Buch!",phon:"leess dass bookh",ex:"lesen → <b>Lies!</b> (e→ie)."},
 {q:"___ ruhig! (Be quiet — du)",t:"Be quiet!",options:["Sei","Bist","Sein","Seid"],answer:0,say:"Sei ruhig!",phon:"zy ROO-ikh",ex:"sein is irregular: <b>Sei!</b>"},
 {q:"___ leise! (Be quiet — ihr)",t:"Be quiet! (you all)",options:["Seid","Sei","Seien","Seit"],answer:0,say:"Seid leise!",phon:"zyt LYE-zuh",ex:"ihr-form of sein → <b>Seid!</b>"},
 {q:"___ auf! (Get up — du)",t:"Get up!",options:["Steh","Stehst","Aufsteh","Stehen"],answer:0,say:"Steh auf!",phon:"shtay owf",ex:"aufstehen splits — prefix to the end: <b>Steh auf!</b>"},
 {q:"___ mich an! (Call me — du)",t:"Call me!",options:["Ruf","Rufst","Anruf","Rufen"],answer:0,say:"Ruf mich an!",phon:"roof mikh ahn",ex:"anrufen splits: <b>Ruf</b> mich <b>an!</b>"},
 {q:"___ langsam! (Drive slowly — du)",t:"Drive slowly!",options:["Fahr","Fähr","Fährst","Fahrt"],answer:0,say:"Fahr langsam!",phon:"far LANG-zahm",ex:"a→ä does NOT umlaut in the imperative: <b>Fahr!</b>"},
 {q:"___ das Fenster! (Open — ihr)",t:"Open the window!",options:["Öffnet","Öffne","Öffnen","Öffnest"],answer:0,say:"Öffnet das Fenster!",phon:"ÖFF-net dass FEN-ster",ex:"ihr-imperative = ihr-form minus pronoun: <b>Öffnet!</b>"},
 {q:"___ Sie hier! (Wait — formal)",t:"Wait here!",options:["Warten","Wart","Wartet","Wartest"],answer:0,say:"Warten Sie hier!",phon:"VAR-ten zee heer",ex:"Formal → infinitive + Sie: <b>Warten Sie!</b>"},
 {q:"___ mir das Salz! (Give — du)",t:"Pass me the salt!",options:["Gib","Geb","Gibst","Gebt"],answer:0,say:"Gib mir das Salz!",phon:"gheep meer dass zalts",ex:"geben → <b>Gib!</b> (e→i)."},
 {q:"___ vorsichtig! (Be careful — Sie)",t:"Be careful! (formal)",options:["Seien Sie","Sei","Seid","Sind Sie"],answer:0,say:"Seien Sie vorsichtig!",phon:"ZY-en zee FOR-zikh-tikh",ex:"Formal sein → <b>Seien Sie!</b>"},
 {q:"___ das Gemüse! (Eat — du)",t:"Eat the vegetables!",options:["Iss","Ess","Isst","Esst"],answer:0,say:"Iss das Gemüse!",phon:"iss dass guh-MÜ-zuh",ex:"essen → <b>Iss!</b> (e→i)."},
 {q:"___ bitte lauter! (Speak — du)",t:"Please speak louder!",options:["Sprich","Sprech","Sprichst","Sprecht"],answer:0,say:"Sprich bitte lauter!",phon:"shprikh BIT-tuh LOW-ter",ex:"sprechen → <b>Sprich!</b> (e→i)."},
 {q:"___ die Tür zu! (Close it — du)",t:"Close the door!",options:["Mach","Machst","Zumach","Macht"],answer:0,say:"Mach die Tür zu!",phon:"makh dee tür tsoo",ex:"zumachen splits: <b>Mach</b> die Tür <b>zu!</b>"},
 {q:"___ hier! (Wait — du)",t:"Wait here!",options:["Warte","Wart","Wartest","Wartet"],answer:0,say:"Warte hier!",phon:"VAR-tuh heer",ex:"Stems ending in -t keep the -e: <b>Warte!</b>"},
 {q:"___ jetzt! (Come now — ihr)",t:"Come now! (you all)",options:["Kommt","Komm","Kommen","Kommst"],answer:0,say:"Kommt jetzt!",phon:"kommt yetst",ex:"ihr-imperative: <b>Kommt!</b>"},
 {q:"___ keine Angst! (Don't be afraid — du)",t:"Don't be afraid!",options:["Hab","Habst","Hast","Habt"],answer:0,say:"Hab keine Angst!",phon:"hahp KY-nuh ahngst",ex:"haben → <b>Hab!</b> (Hab keine Angst)."},
 {q:"___ Sie mir bitte! (Help — formal)",t:"Please help me! (formal)",options:["Helfen","Hilf","Helft","Hilfst"],answer:0,say:"Helfen Sie mir bitte!",phon:"HEL-fen zee meer BIT-tuh",ex:"Sie-form uses the plain infinitive — no vowel change: <b>Helfen Sie!</b>"}
]},
{id:"trenn", title:"Trennbare Verben", desc:"aufstehen, einkaufen, fernsehen", qs:[
 {q:"Ich stehe um 7 ___.",t:"I get up at 7. (aufstehen)",options:["auf","aus","an","ein"],answer:0,say:"Ich stehe um 7 auf.",phon:"ikh SHTAY-uh oom zee-ben owf",ex:"aufstehen splits — prefix <b>auf</b> goes to the end."},
 {q:"Wir kaufen im Supermarkt ___.",t:"We shop at the supermarket. (einkaufen)",options:["ein","auf","an","mit"],answer:0,say:"Wir kaufen im Supermarkt ein.",phon:"veer KOW-fen im ZOO-per-markt eyn",ex:"einkaufen → prefix <b>ein</b> to the end."},
 {q:"Er sieht abends ___.",t:"He watches TV in the evening. (fernsehen)",options:["fern","vor","an","auf"],answer:0,say:"Er sieht abends fern.",phon:"air zeet AH-bents fairn",ex:"fernsehen → <b>fern</b> to the end."},
 {q:"Ich rufe dich morgen ___.",t:"I'll call you tomorrow. (anrufen)",options:["an","auf","ein","mit"],answer:0,say:"Ich rufe dich morgen an.",phon:"ikh ROO-fuh dikh MOR-gen ahn",ex:"anrufen → <b>an</b> to the end."},
 {q:"Der Zug kommt um 9 ___.",t:"The train arrives at 9. (ankommen)",options:["an","ab","auf","mit"],answer:0,say:"Der Zug kommt um 9 an.",phon:"dair tsook kommt oom noyn ahn",ex:"ankommen → <b>an</b> to the end."},
 {q:"Wir räumen das Zimmer ___.",t:"We tidy up the room. (aufräumen)",options:["auf","ein","an","aus"],answer:0,say:"Wir räumen das Zimmer auf.",phon:"veer ROY-men dass TSIM-mer owf",ex:"aufräumen → <b>auf</b> to the end."},
 {q:"Kommst du ___?",t:"Are you coming along? (mitkommen)",options:["mit","an","auf","ein"],answer:0,say:"Kommst du mit?",phon:"kommst doo mit",ex:"mitkommen → <b>mit</b> to the end."},
 {q:"Der Film fängt um 8 ___.",t:"The film starts at 8. (anfangen)",options:["an","auf","ein","ab"],answer:0,say:"Der Film fängt um 8 an.",phon:"dair film fengt oom akht ahn",ex:"anfangen → <b>an</b> to the end."},
 {q:"Which is correct? (aufstehen)",t:"I get up early.",options:["Ich stehe früh auf.","Ich aufstehe früh.","Ich stehe auf früh.","Ich früh stehe auf."],answer:0,say:"Ich stehe früh auf.",phon:"ikh SHTAY-uh frü owf",ex:"Conjugated verb 2nd, prefix at the very end: … früh <b>auf</b>."},
 {q:"Ich lade dich zur Party ___.",t:"I'm inviting you to the party. (einladen)",options:["ein","an","auf","mit"],answer:0,say:"Ich lade dich zur Party ein.",phon:"ikh LAH-duh dikh tsoor PAR-tee eyn",ex:"einladen → <b>ein</b> to the end."},
 {q:"Machst du bitte das Fenster ___?",t:"Will you close the window? (zumachen)",options:["zu","auf","an","ab"],answer:0,say:"Machst du bitte das Fenster zu?",phon:"makhst doo BIT-tuh dass FEN-ster tsoo",ex:"zumachen → <b>zu</b> to the end."},
 {q:"Der Bus fährt um 10 ___.",t:"The bus departs at 10. (abfahren)",options:["ab","an","auf","aus"],answer:0,say:"Der Bus fährt um 10 ab.",phon:"dair booss fairt oom tsayn ahp",ex:"abfahren → <b>ab</b> to the end."},
 {q:"Wann stehst du ___?",t:"When do you get up? (aufstehen)",options:["auf","an","aus","ein"],answer:0,say:"Wann stehst du auf?",phon:"vann shtayst doo owf",ex:"Even in a question the prefix goes last: … du <b>auf?</b>"},
 {q:"Ich mache das Licht ___.",t:"I turn on the light. (anmachen)",options:["an","auf","zu","ab"],answer:0,say:"Ich mache das Licht an.",phon:"ikh MAKH-uh dass likht ahn",ex:"anmachen → <b>an</b> to the end."},
 {q:"Kaufst du ___? (einkaufen)",t:"Do you go shopping?",options:["ein","auf","an","mit"],answer:0,say:"Kaufst du ein?",phon:"kowfst doo eyn",ex:"einkaufen → <b>ein</b> to the end."},
 {q:"Which is a separable verb?",t:"",options:["aufstehen","verstehen","besuchen","erklären"],answer:0,say:"aufstehen",phon:"OWF-shtay-en",ex:"<b>aufstehen</b> (auf|stehen) splits. ver-, be-, er- are inseparable — they never detach."},
 {q:"Räum bitte dein Zimmer ___!",t:"Please tidy your room! (aufräumen)",options:["auf","ein","an","zu"],answer:0,say:"Räum bitte dein Zimmer auf!",phon:"roym BIT-tuh dine TSIM-mer owf",ex:"The prefix still goes to the end in commands: <b>auf!</b>"},
 {q:"Ich sehe gern ___.",t:"I like watching TV. (fernsehen)",options:["fern","vor","an","auf"],answer:0,say:"Ich sehe gern fern.",phon:"ikh ZAY-uh gairn fairn",ex:"fernsehen → <b>fern</b> to the end."},
 {q:"With a modal — 'I have to get up early':",t:"",options:["Ich muss früh aufstehen.","Ich muss früh stehe auf.","Ich muss auf früh stehen.","Ich stehe muss früh auf."],answer:0,say:"Ich muss früh aufstehen.",phon:"ikh mooss frü OWF-shtay-en",ex:"After a modal the separable verb stays whole as an infinitive: <b>aufstehen</b>."},
 {q:"Wir kommen um 6 Uhr ___.",t:"We arrive at 6. (ankommen)",options:["an","auf","ein","ab"],answer:0,say:"Wir kommen um 6 Uhr an.",phon:"veer KOMM-en oom zeks oor ahn",ex:"ankommen → <b>an</b> to the end."}
]},
{id:"dat", title:"Präpositionen + Dativ", desc:"in, auf, bei, mit (location)", qs:[
 {q:"Ich bin ___ Haus.",t:"I'm in the house. (das Haus)",options:["im","in den","in das","ins"],answer:0,say:"Ich bin im Haus.",phon:"ikh bin im howss",ex:"Location (wo?) → dative. in dem Haus → <b>im</b> Haus."},
 {q:"Das Buch liegt ___ Tisch.",t:"The book is on the table. (der Tisch)",options:["auf dem","auf den","auf der","auf das"],answer:0,say:"Das Buch liegt auf dem Tisch.",phon:"dass bookh leekt owf daym tish",ex:"der Tisch → dative <b>dem</b>; resting place = dative."},
 {q:"Ich wohne bei ___ Mutter.",t:"I live with my mother. (bei + dative)",options:["meiner","meine","meinen","mein"],answer:0,say:"Ich wohne bei meiner Mutter.",phon:"ikh VOH-nuh by MY-ner MOO-ter",ex:"bei always takes dative; die Mutter → der → <b>meiner</b>."},
 {q:"Ich fahre ___ Auto.",t:"I go by car. (mit + dative)",options:["mit dem","mit den","mit das","mit der"],answer:0,say:"Ich fahre mit dem Auto.",phon:"ikh FAH-ruh mit daym OW-toh",ex:"mit always takes dative; das Auto → <b>dem</b>."},
 {q:"Wir sind ___ Schule.",t:"We're at school. (die Schule, location)",options:["in der","in die","in den","ins"],answer:0,say:"Wir sind in der Schule.",phon:"veer zint in dair SHOO-luh",ex:"die Schule → dative <b>der</b>; location."},
 {q:"'Wo bist du?' expects a location — which case?",t:"",options:["Dative","Accusative","Nominative","Genitive"],answer:0,say:"Wo bist du?",phon:"voh bist doo",ex:"wo? (location) → <b>dative</b>; wohin? (direction) → accusative."},
 {q:"Die Katze ist ___ Bett.",t:"The cat is on the bed. (das Bett)",options:["auf dem","auf das","aufs","auf den"],answer:0,say:"Die Katze ist auf dem Bett.",phon:"dee KAT-suh ist owf daym bett",ex:"das Bett → dative <b>dem</b>; location."},
 {q:"Ich treffe dich ___ Bahnhof.",t:"I'll meet you at the station. (der Bahnhof)",options:["am","an den","ans","an der"],answer:0,say:"Ich treffe dich am Bahnhof.",phon:"ikh TREF-fuh dikh am BAHN-hohf",ex:"an dem Bahnhof → <b>am</b> Bahnhof (location)."},
 {q:"Er arbeitet bei ___ Bank.",t:"He works at a bank. (bei + dative)",options:["einer","eine","einen","ein"],answer:0,say:"Er arbeitet bei einer Bank.",phon:"air AR-by-tet by EYE-ner bank",ex:"bei + dative; eine Bank → <b>einer</b>."},
 {q:"Das Bild hängt ___ Wand.",t:"The picture hangs on the wall. (die Wand)",options:["an der","an die","an den","ans"],answer:0,say:"Das Bild hängt an der Wand.",phon:"dass bilt hengt an dair vant",ex:"die Wand → dative <b>der</b>; location."},
 {q:"Ich bin ___ Hause.",t:"I'm at home.",options:["zu","in","bei","an"],answer:0,say:"Ich bin zu Hause.",phon:"ikh bin tsoo HOW-zuh",ex:"'<b>zu Hause</b>' = at home — a fixed dative expression."},
 {q:"Der Hund schläft ___ Sofa.",t:"The dog sleeps on the sofa. (das Sofa)",options:["auf dem","auf das","aufs","auf den"],answer:0,say:"Der Hund schläft auf dem Sofa.",phon:"dair hoont shleft owf daym ZOH-fah",ex:"das Sofa → dative <b>dem</b>; location."},
 {q:"Wir wohnen ___ Berlin.",t:"We live in Berlin.",options:["in","im","in dem","an"],answer:0,say:"Wir wohnen in Berlin.",phon:"veer VOH-nen in bair-LEEN",ex:"With city names, just <b>in</b> Berlin — no article."},
 {q:"Ich spiele mit ___ Kindern.",t:"I play with the children. (plural)",options:["den","die","der","dem"],answer:0,say:"Ich spiele mit den Kindern.",phon:"ikh SHPEE-luh mit dayn KIN-dern",ex:"Dative plural = <b>den</b>, and the noun adds -n: den Kinder<b>n</b>."},
 {q:"Sie sitzt ___ Stuhl.",t:"She sits on the chair. (der Stuhl)",options:["auf dem","auf den","auf der","aufs"],answer:0,say:"Sie sitzt auf dem Stuhl.",phon:"zee zitst owf daym shtool",ex:"der Stuhl → dative <b>dem</b>; location."},
 {q:"Ich bin ___ der Arbeit.",t:"I'm at work.",options:["bei","in","auf","mit"],answer:0,say:"Ich bin bei der Arbeit.",phon:"ikh bin by dair AR-byt",ex:"'<b>bei der Arbeit</b>' = at work — bei + dative."},
 {q:"Fahren wir ___ Bus?",t:"Shall we go by bus? (der Bus)",options:["mit dem","mit den","mit der","mit das"],answer:0,say:"Fahren wir mit dem Bus?",phon:"FAH-ren veer mit daym booss",ex:"mit + dative; der Bus → <b>dem</b>."},
 {q:"Das Restaurant ist ___ Stadt.",t:"The restaurant is in the city. (die Stadt)",options:["in der","in die","in den","ins"],answer:0,say:"Das Restaurant ist in der Stadt.",phon:"dass res-toh-RAHNG ist in dair shtat",ex:"die Stadt → dative <b>der</b>; location."},
 {q:"'in dem' contracts to:",t:"",options:["im","ins","am","beim"],answer:0,say:"im",phon:"im",ex:"in dem → <b>im</b>, an dem → am, bei dem → beim."},
 {q:"Location (wo?) with in/auf/an takes which case?",t:"",options:["Dative","Accusative","Nominative","Both"],answer:0,say:"Wo? Dativ.",phon:"voh — DAH-teef",ex:"wo? = <b>dative</b> (resting place); wohin? = accusative (movement)."}
]},
{id:"perf", title:"Perfekt", desc:"haben/sein + past participle", qs:[
 {q:"Ich ___ Pizza gegessen.",t:"I ate pizza.",options:["habe","bin","hast","ist"],answer:0,say:"Ich habe Pizza gegessen.",phon:"ikh HAH-buh PIT-sah guh-GES-sen",ex:"Most verbs use <b>haben</b>: ich habe … gegessen."},
 {q:"Er ___ nach Berlin gefahren.",t:"He drove to Berlin.",options:["ist","hat","bin","hast"],answer:0,say:"Er ist nach Berlin gefahren.",phon:"air ist nakh bair-LEEN guh-FAH-ren",ex:"fahren = movement → <b>sein</b>: er ist gefahren."},
 {q:"Ich habe das ___. (machen)",t:"I did that.",options:["gemacht","gemachen","gemakt","macht"],answer:0,say:"Ich habe das gemacht.",phon:"ikh HAH-buh dass guh-MAKHT",ex:"Weak verb: ge + mach + t → <b>gemacht</b>."},
 {q:"Wir sind nach Hause ___. (gehen)",t:"We went home.",options:["gegangen","gegeht","gegangt","gegehen"],answer:0,say:"Wir sind nach Hause gegangen.",phon:"veer zint nakh HOW-zuh guh-GANG-en",ex:"Strong verb gehen → <b>gegangen</b>, with sein."},
 {q:"Sie ___ ein Buch gelesen.",t:"She read a book.",options:["hat","ist","bin","sind"],answer:0,say:"Sie hat ein Buch gelesen.",phon:"zee hat eyn bookh guh-LAY-zen",ex:"lesen takes <b>haben</b> (no movement)."},
 {q:"Ich ___ um 7 aufgestanden.",t:"I got up at 7.",options:["bin","habe","hat","ist"],answer:0,say:"Ich bin um 7 aufgestanden.",phon:"ikh bin oom zee-ben OWF-guh-shtan-den",ex:"aufstehen = change of state → <b>sein</b>: ich bin aufgestanden."},
 {q:"Er hat Wasser ___. (trinken)",t:"He drank water.",options:["getrunken","getrinkt","getrunkt","getrinken"],answer:0,say:"Er hat Wasser getrunken.",phon:"air hat VAS-ser guh-TROON-ken",ex:"Strong verb: trinken → <b>getrunken</b>."},
 {q:"Ich habe einen Film ___. (sehen)",t:"I watched a film.",options:["gesehen","gesieht","geseht","gesah"],answer:0,say:"Ich habe einen Film gesehen.",phon:"ikh HAH-buh EYE-nen film guh-ZAY-en",ex:"sehen → <b>gesehen</b>."},
 {q:"Wir haben Brot ___. (kaufen)",t:"We bought bread.",options:["gekauft","gekaufen","kauft","gekaufte"],answer:0,say:"Wir haben Brot gekauft.",phon:"veer HAH-ben broht guh-KOWFT",ex:"Weak verb: ge + kauf + t → <b>gekauft</b>."},
 {q:"Ich ___ zu Hause geblieben.",t:"I stayed home.",options:["bin","habe","hat","ist"],answer:0,say:"Ich bin zu Hause geblieben.",phon:"ikh bin tsoo HOW-zuh guh-BLEE-ben",ex:"bleiben takes <b>sein</b> — a key exception to memorise."},
 {q:"Sie hat viel ___. (arbeiten)",t:"She worked a lot.",options:["gearbeitet","gearbeit","gearbeitt","arbeitet"],answer:0,say:"Sie hat viel gearbeitet.",phon:"zee hat feel guh-AR-by-tet",ex:"Stem ends in -t → extra -e-: <b>gearbeitet</b>."},
 {q:"Ich habe dich nicht ___. (verstehen)",t:"I didn't understand you.",options:["verstanden","geverstanden","versteht","gestanden"],answer:0,say:"Ich habe dich nicht verstanden.",phon:"ikh HAH-buh dikh nikht fair-SHTAN-den",ex:"Inseparable prefix ver- → <b>no ge-</b>: verstanden."},
 {q:"Wir haben lange ___. (telefonieren)",t:"We talked on the phone for a while.",options:["telefoniert","getelefoniert","telefonieren","telefonierte"],answer:0,say:"Wir haben lange telefoniert.",phon:"veer HAH-ben LANG-uh tay-lay-foh-NEERT",ex:"Verbs in -ieren take <b>no ge-</b>: telefoniert."},
 {q:"Ich habe im Supermarkt ___. (einkaufen)",t:"I shopped at the supermarket.",options:["eingekauft","geeinkauft","einkauft","eingekaufen"],answer:0,say:"Ich habe im Supermarkt eingekauft.",phon:"ikh HAH-buh im ZOO-per-markt EYN-guh-kowft",ex:"Separable: ge goes inside → ein<b>ge</b>kauft."},
 {q:"Der Zug ___ um 9 angekommen.",t:"The train arrived at 9.",options:["ist","hat","bin","sind"],answer:0,say:"Der Zug ist um 9 angekommen.",phon:"dair tsook ist oom noyn AHN-guh-kom-men",ex:"ankommen = movement → <b>sein</b>. Participle: angekommen."},
 {q:"Er hat einen Brief ___. (schreiben)",t:"He wrote a letter.",options:["geschrieben","geschreibt","geschrieb","geschreiben"],answer:0,say:"Er hat einen Brief geschrieben.",phon:"air hat EYE-nen breef guh-SHREE-ben",ex:"schreiben → <b>geschrieben</b>."},
 {q:"___ du gut geschlafen?",t:"Did you sleep well?",options:["Hast","Bist","Habt","Ist"],answer:0,say:"Hast du gut geschlafen?",phon:"hast doo goot guh-SHLAH-fen",ex:"schlafen takes <b>haben</b>: Hast du geschlafen?"},
 {q:"Where does the participle go? 'I bought bread':",t:"",options:["Ich habe Brot gekauft.","Ich habe gekauft Brot.","Ich gekauft habe Brot.","Ich Brot habe gekauft."],answer:0,say:"Ich habe Brot gekauft.",phon:"ikh HAH-buh broht guh-KOWFT",ex:"The participle goes to the very <b>end</b>: … Brot gekauft."},
 {q:"Wir ___ ins Kino gegangen.",t:"We went to the cinema.",options:["sind","haben","hat","ist"],answer:0,say:"Wir sind ins Kino gegangen.",phon:"veer zint ins KEE-noh guh-GANG-en",ex:"gehen → <b>sein</b>: wir sind gegangen."},
 {q:"Ich habe meine Oma ___. (besuchen)",t:"I visited my grandma.",options:["besucht","gebesucht","besuchen","besuchte"],answer:0,say:"Ich habe meine Oma besucht.",phon:"ikh HAH-buh MY-nuh OH-mah buh-ZOOKHT",ex:"Inseparable be- → <b>no ge-</b>: besucht."},
 {q:"___ ihr Fußball gespielt?",t:"Did you (all) play football?",options:["Habt","Seid","Hat","Bist"],answer:0,say:"Habt ihr Fußball gespielt?",phon:"hahpt eer FOOSS-bal guh-SHPEELT",ex:"spielen takes <b>haben</b>: Habt ihr gespielt?"},
 {q:"Ich ___ in Spanien gewesen.",t:"I was in Spain.",options:["bin","habe","hat","ist"],answer:0,say:"Ich bin in Spanien gewesen.",phon:"ikh bin in SHPAH-nyen guh-VAY-zen",ex:"sein itself uses sein: ich <b>bin</b> gewesen."}
]}
);

/* Regelmeister — recovered. k: rule|trigger|contrast. topic keys map to Grammatik hub topics. */
window.RULES = {
wfragen:[
 {k:'rule',q:'In a <em>W-Frage</em>, what always sits in position 2?',o:['The subject','The conjugated verb','The question word','The time expression'],a:1,why:'The W-word takes position 1, the conjugated verb takes position 2, and the subject follows it. The verb-second rule survives even in questions.',de:'Wann kommst du nach Hause?',ph:'VAN komst doo nakh HOW-zuh'},
 {k:'rule',q:'How is a <em>Ja/Nein-Frage</em> built differently from a statement?',o:['You add a question word at the front','The verb moves to position 1','The subject moves to the end','Nothing changes but the tone'],a:1,why:'Yes/no questions push the conjugated verb into first position, ahead of the subject. No question word is used at all.',de:'Kommst du morgen?',ph:'komst doo MOR-gun'},
 {k:'trigger',q:'Which W-word asks for the <em>subject</em> — the person doing the action?',o:['Wen','Wer','Wem','Was'],a:1,why:'Wer is the nominative question word: it asks who performs the action. Wen asks for the accusative object, wem for the dative object.',de:'Wer bezahlt die Rechnung?',ph:'VAIR buh-TSAHLT dee REKH-noong'},
 {k:'contrast',q:'<em>Wo</em> vs. <em>wohin</em> — what is the difference?',o:['Wo is formal, wohin is informal','Wo asks location, wohin asks direction','Wo is for people, wohin for things','They are interchangeable'],a:1,why:'Wo asks where something is (static). Wohin asks where something is going (movement toward). Woher asks where it came from.',de:'Wo bist du? Wohin gehst du?',ph:'voh bist doo — voh-HIN gayst doo'},
 {k:'contrast',q:'When do you use <em>welche(r/s)</em> instead of <em>was</em>?',o:['When the choice is from a known, limited set','When speaking formally','When the noun is plural','When asking about time'],a:0,why:'Was asks open-endedly. Welcher asks you to pick from options already on the table, and it changes ending to match the noun.',de:'Welchen Zug nimmst du?',ph:'VEL-khun tsook nimst doo'},
 {k:'trigger',q:'Which W-word asks about <em>cost or quantity</em>?',o:['Wie lange','Wie viel','Wie oft','Wie weit'],a:1,why:'Wie viel asks how much (uncountable or price); wie viele asks how many. Wie lange is duration, wie oft is frequency.',de:'Wie viel kostet das?',ph:'vee feel KOS-tut dass'},
 {k:'rule',q:'Where does the subject go in <em>Warum lernst du Deutsch?</em>',o:['Before the verb','Directly after the conjugated verb','At the end of the sentence','It is left out'],a:1,why:'Because the W-word occupies position 1 and the verb position 2, the subject is displaced to position 3 — right behind the verb.',de:'Warum lernst du Deutsch?',ph:'va-ROOM lairnst doo doytch'},
 {k:'trigger',q:'Which W-word asks about <em>origin</em> — where someone comes from?',o:['Wohin','Woher','Wo','Wann'],a:1,why:'Woher = from where. It pairs with aus: Ich komme aus Kanada.',de:'Woher kommst du?',ph:'voh-HAIR komst doo'},
 {k:'contrast',q:'<em>Wer</em> vs. <em>wen</em> — what decides which one you use?',o:['Politeness level','Whether the person is subject or direct object','Singular or plural','The tense of the verb'],a:1,why:'Wer is nominative (the doer). Wen is accusative (the one receiving the action). Same masculine -n pattern as der → den.',de:'Wen siehst du?',ph:'vayn zeest doo'},
 {k:'rule',q:'In a W-Frage with a <em>modal verb</em>, where does the infinitive go?',o:['Right after the W-word','Right after the subject','At the very end','It merges with the modal'],a:2,why:'The modal is conjugated in position 2 and the infinitive is thrown to the end, forming the Satzklammer (sentence bracket).',de:'Wann kannst du kommen?',ph:'van kanst doo KO-mun'}
],
pronouns:[
 {k:'contrast',q:'<em>du</em>, <em>ihr</em>, <em>Sie</em> — which do you use with two strangers in a shop?',o:['du','ihr','Sie','Any of them'],a:2,why:'Sie is the formal address for one person or many. Ihr is the informal plural — friends, family, children. Du is informal singular.',de:'Können Sie mir helfen?',ph:'KUR-nun zee meer HEL-fun'},
 {k:'rule',q:'What is the tell that distinguishes <em>sie</em> (she) from <em>sie</em> (they) in writing?',o:['Capitalization','The verb ending','A different spelling','Context only'],a:1,why:'Sie ist = she is (-t ending). Sie sind = they are (-en ending). The verb does the disambiguating. Formal Sie is capitalized mid-sentence.',de:'Sie ist müde. Sie sind müde.',ph:'zee ist MUE-duh — zee zint MUE-duh'},
 {k:'rule',q:'Which pronoun replaces <em>das Mädchen</em>?',o:['sie','es','er','die'],a:1,why:'Pronouns follow grammatical gender, not natural gender. Mädchen is neuter (the -chen ending forces it), so it takes es.',de:'Das Mädchen? Es ist da.',ph:'dass MAYT-khun — ess ist dah'},
 {k:'trigger',q:'Which pronoun replaces <em>der Tisch</em>?',o:['es','sie','er','ihn'],a:2,why:'A der-noun is replaced by er, a die-noun by sie, a das-noun by es — regardless of whether the thing is alive.',de:'Der Tisch ist alt. Er ist alt.',ph:'dair tish ist alt — air ist alt'},
 {k:'rule',q:'Which verb form does formal <em>Sie</em> take?',o:['The du-form','The er/sie/es-form','The same form as wir/sie plural','Its own unique form'],a:2,why:'Formal Sie borrows the plural form: Sie kommen, Sie haben, Sie sind. It looks like they-forms but is capitalized.',de:'Sie haben recht.',ph:'zee HAH-bun rekht'},
 {k:'contrast',q:'<em>ihr</em> as a pronoun vs. <em>ihr</em> as a possessive — how do you tell them apart?',o:['By capitalization','By whether a noun follows it','By the tense','You cannot'],a:1,why:'Possessive ihr is always attached to a noun (ihr Auto = her car). Pronoun ihr stands alone as a subject (ihr kommt = you all are coming).',de:'Ihr habt ihr Auto.',ph:'eer hapt eer OW-toh'},
 {k:'rule',q:'In accusative, <em>ich</em> becomes ___ and <em>er</em> becomes ___.',o:['mir / ihm','mich / ihn','mein / sein','mich / er'],a:1,why:'Accusative pronouns: mich, dich, ihn, sie, es, uns, euch, sie. Only masculine visibly changes shape, just like der → den.',de:'Er sieht mich. Ich sehe ihn.',ph:'air zeet mikh — ikh ZAY-uh een'},
 {k:'trigger',q:'You are talking to one child. Which pronoun?',o:['Sie','ihr','du','man'],a:2,why:'Children always get du, regardless of the setting. Formality kicks in with adults you do not know.',de:'Wie heißt du?',ph:'vee hyst doo'}
],
present:[
 {k:'rule',q:'How do you find a regular verb <em>stem</em>?',o:['Remove the first letter','Remove -en from the infinitive','Add -t to the infinitive','Remove all vowels'],a:1,why:'Infinitive minus -en gives the stem: lernen → lern-. Endings are then bolted onto that stem.',de:'lernen → ich lerne',ph:'LAIR-nun — ikh LAIR-nuh'},
 {k:'rule',q:'Which ending goes with <em>du</em>?',o:['-e','-st','-t','-en'],a:1,why:'The full set: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en. Du and er/sie/es are the two that most often hide a stem change too.',de:'Du kommst aus Berlin.',ph:'doo komst ows bair-LEEN'},
 {k:'rule',q:'Which endings are <em>identical</em> in the present tense?',o:['ich and du','wir and sie/Sie','du and ihr','er and wir'],a:1,why:'Wir, sie (plural) and formal Sie all take -en — the bare infinitive form. Also er/sie/es and ihr share -t.',de:'Wir gehen. Sie gehen.',ph:'veer GAY-un — zee GAY-un'},
 {k:'rule',q:'Why is it <em>du arbeitest</em> and not <em>du arbeitst</em>?',o:['Arbeiten is irregular','A stem ending in -t or -d needs a helper -e','It is a spelling exception only','The verb is separable'],a:1,why:'When the stem ends in -t, -d, or a consonant cluster, an -e is inserted before -st and -t so the word stays pronounceable: du arbeitest, er arbeitet.',de:'Du arbeitest viel.',ph:'doo AR-by-tust feel'},
 {k:'trigger',q:'In a stem-changing verb like <em>fahren</em>, which forms actually change?',o:['All of them','Only du and er/sie/es','Only the plural forms','Only ich'],a:1,why:'Vowel changes (a→ä, e→i, e→ie) hit only the du and er/sie/es forms. Everything else keeps the original stem vowel.',de:'Ich fahre, du fährst, er fährt.',ph:'ikh FAH-ruh, doo fairst, air fairt'},
 {k:'trigger',q:'Which change does <em>sprechen</em> undergo?',o:['a → ä','e → i','e → ie','o → ö'],a:1,why:'Short e becomes i (sprechen → du sprichst). Long e becomes ie (sehen → du siehst). Both only in du and er/sie/es.',de:'Du sprichst gut Deutsch.',ph:'doo shprikhst goot doytch'},
 {k:'rule',q:'Which two verbs are so irregular you simply memorize the whole table?',o:['gehen and kommen','sein and haben','machen and sagen','lernen and wohnen'],a:1,why:'Sein (bin, bist, ist, sind, seid, sind) and haben (habe, hast, hat, haben, habt, haben) do not follow the pattern and are needed constantly — including for the Perfekt.',de:'Ich bin da und habe Zeit.',ph:'ikh bin dah oont HAH-buh tsyt'},
 {k:'contrast',q:'German present tense also covers which English tense?',o:['Past simple','Present continuous ("I am doing")','Future perfect','Conditional'],a:1,why:'Ich lerne means both "I learn" and "I am learning" — German has no separate continuous form. It also often covers the near future with a time word.',de:'Ich lerne gerade Deutsch.',ph:'ikh LAIR-nuh guh-RAH-duh doytch'}
],
gender:[
 {k:'trigger',q:'A noun ending in <em>-ung</em> is which gender?',o:['Masculine','Feminine','Neuter','It varies'],a:1,why:'-ung, -heit, -keit, -schaft, -tion and -ei are reliably feminine. Learning endings is faster than learning nouns one at a time.',de:'die Wohnung, die Zeitung',ph:'dee VOH-noong, dee TSY-toong'},
 {k:'trigger',q:'A noun ending in <em>-chen</em> or <em>-lein</em> is which gender?',o:['Masculine','Feminine','Neuter','Depends on the root word'],a:2,why:'Diminutives are always neuter, which overrides the natural gender of the root — hence das Mädchen.',de:'das Brötchen, das Fräulein',ph:'dass BRUT-khun, dass FROY-lyn'},
 {k:'rule',q:'What is the definite article for <em>all plural nouns</em>?',o:['der','die','das','den'],a:1,why:'Every plural noun takes die in the nominative, whatever its singular gender was. Plural is the one place gender stops mattering.',de:'die Männer, die Frauen, die Kinder',ph:'dee MEN-ur, dee FROW-un, dee KIN-dur'},
 {k:'rule',q:'What is the indefinite article in the plural?',o:['eine','ein','einen','There is none'],a:3,why:'Ein has no plural. You simply drop it: ein Buch → Bücher. Its negative kein does have a plural though: keine Bücher.',de:'ein Buch → Bücher',ph:'yn bookh — BUE-khur'},
 {k:'contrast',q:'When do you switch from <em>ein</em> to <em>der/die/das</em>?',o:['After the first mention, once it is known','In writing only','When the noun is plural','After a preposition'],a:0,why:'Indefinite introduces something new; definite refers back to something already established or uniquely identifiable.',de:'Ich sehe einen Hund. Der Hund ist groß.',ph:'ikh ZAY-uh Y-nun hoont — dair hoont ist grohss'},
 {k:'trigger',q:'A noun made from a verb stem plus <em>-er</em> (Lehrer, Fahrer) is which gender?',o:['Masculine','Feminine','Neuter','Plural'],a:0,why:'Agent nouns in -er are masculine; the -in suffix makes the feminine form, which is then a die-word: die Lehrerin.',de:'der Lehrer, die Lehrerin',ph:'dair LAY-rur, dee LAY-ruh-rin'},
 {k:'rule',q:'What must you always do with a German noun in writing?',o:['Underline it','Capitalize it','Put an article before it','Add an ending'],a:1,why:'Every noun is capitalized, anywhere in the sentence. It is also the fastest way to spot nouns when reading.',de:'Der Hund frisst das Brot.',ph:'dair hoont frist dass broht'},
 {k:'trigger',q:'Infinitives used as nouns (das Essen, das Lernen) take which gender?',o:['Masculine','Feminine','Neuter','They keep the verb gender'],a:2,why:'Any infinitive turned into a noun is neuter: das Schwimmen, das Trinken. Very reliable rule.',de:'Das Lernen macht Spaß.',ph:'dass LAIR-nun makht shpahss'}
],
wordorder:[
 {k:'rule',q:'In a German statement, the conjugated verb occupies which position?',o:['First','Second','Last','Anywhere'],a:1,why:'Verb-second is the backbone rule. Position 1 can hold any single element — subject, time, place — but position 2 belongs to the conjugated verb.',de:'Heute gehe ich ins Kino.',ph:'HOY-tuh GAY-uh ikh ins KEE-noh'},
 {k:'rule',q:'You start a sentence with <em>Morgen</em>. What happens to the subject?',o:['It disappears','It moves after the verb','It stays before the verb','It takes accusative'],a:1,why:'This is inversion. Fronting anything other than the subject forces the subject behind the verb to protect position 2.',de:'Morgen fahre ich nach Köln.',ph:'MOR-gun FAH-ruh ikh nakh kurln'},
 {k:'rule',q:'What is the <em>TeKaMoLo</em> order for the middle of a sentence?',o:['Time, cause, manner, place','Place, manner, cause, time','Time, place, manner, cause','Manner, time, place, cause'],a:0,why:'Temporal (when) → Kausal (why) → Modal (how) → Lokal (where). It is a default, not a straitjacket, but it sounds native.',de:'Ich fahre heute mit dem Bus nach Hause.',ph:'ikh FAH-ruh HOY-tuh mit daym boos nakh HOW-zuh'},
 {k:'rule',q:'With a modal verb, what forms the <em>Satzklammer</em> (sentence bracket)?',o:['Subject and object','Modal in position 2 and infinitive at the end','Two nouns','Article and noun'],a:1,why:'The conjugated part sits in position 2, the non-conjugated part is thrown to the very end, and everything else is packed between them.',de:'Ich muss heute früh aufstehen.',ph:'ikh mooss HOY-tuh frue OWF-shtay-un'},
 {k:'trigger',q:'Do <em>und</em>, <em>aber</em> and <em>oder</em> occupy position 1?',o:['Yes, they push the verb to position 3','No, they sit outside the count','Only aber does','Only in questions'],a:1,why:'These coordinating conjunctions are position zero — they connect without disturbing word order, so the normal subject-verb sequence follows.',de:'Ich komme, aber ich bleibe nicht lange.',ph:'ikh KO-muh, AH-bur ikh BLY-buh nikht LAHNG-uh'},
 {k:'contrast',q:'Statement vs. yes/no question — what actually moves?',o:['The object','The conjugated verb, to position 1','The subject, to the end','The time expression'],a:1,why:'Du kommst → Kommst du? Only the verb hops in front of the subject. Everything else keeps its place.',de:'Kommst du mit?',ph:'komst doo mit'},
 {k:'rule',q:'Where does a <em>dative</em> object usually go relative to an accusative noun object?',o:['After it','Before it','It must be last','Order is random'],a:1,why:'Two noun objects: dative before accusative. Ich gebe dem Kind das Buch. If the accusative is a pronoun, it jumps ahead: Ich gebe es dem Kind.',de:'Ich gebe dem Kind das Buch.',ph:'ikh GAY-buh daym kint dass bookh'}
],
negation:[
 {k:'contrast',q:'When do you use <em>kein</em> rather than <em>nicht</em>?',o:['To negate verbs','To negate a noun that has ein or no article','In questions only','In the past tense'],a:1,why:'Kein replaces ein and also negates bare nouns with no article. Everything else — verbs, adjectives, adverbs, and nouns with der/die/das or a possessive — takes nicht.',de:'Ich habe kein Auto.',ph:'ikh HAH-buh kyn OW-toh'},
 {k:'trigger',q:'Negate <em>Ich habe Zeit</em> (no article at all).',o:['Ich habe nicht Zeit','Ich habe keine Zeit','Ich habe nicht die Zeit','Ich habe kein Zeit'],a:1,why:'A bare noun still takes kein, and kein carries the gender ending — Zeit is feminine, so keine.',de:'Ich habe keine Zeit.',ph:'ikh HAH-buh KY-nuh tsyt'},
 {k:'contrast',q:'Why is it <em>Das ist nicht mein Buch</em> and not <em>kein Buch</em>?',o:['Because the sentence is a statement','Because a possessive article is already there','Because Buch is neuter','Because ist is irregular'],a:1,why:'Kein can only take the slot ein would occupy. Once mein, dein or der is present, that slot is filled, so you must use nicht.',de:'Das ist nicht mein Buch.',ph:'dass ist nikht myn bookh'},
 {k:'rule',q:'To negate a whole sentence, where does <em>nicht</em> go?',o:['Right after the subject','Right before the verb','At or near the end','Position 1'],a:2,why:'Sentence negation lands late — after objects and time expressions. Ich kaufe das Buch nicht.',de:'Ich kaufe das Buch nicht.',ph:'ikh KOW-fuh dass bookh nikht'},
 {k:'rule',q:'Where does <em>nicht</em> go when a separable prefix or infinitive ends the sentence?',o:['After it','Directly before it','At the very start','It merges with the verb'],a:1,why:'Nicht slots in just ahead of that final element: Ich rufe dich nicht an. Ich kann nicht kommen.',de:'Ich rufe dich nicht an.',ph:'ikh ROO-fuh dikh nikht an'},
 {k:'rule',q:'Where does <em>nicht</em> go when negating an adjective or adverb?',o:['After it','Directly before it','At the end','Either side works'],a:1,why:'Partial negation sits immediately in front of what it targets: nicht gut, nicht schnell, nicht heute.',de:'Der Film ist nicht gut.',ph:'dair film ist nikht goot'},
 {k:'rule',q:'How does <em>kein</em> take its endings?',o:['It never changes','Exactly like ein (plus a plural form)','Like der/die/das','Like an adjective'],a:1,why:'kein, keine, keinen, keinem... it declines like ein. The one bonus: unlike ein, it has a plural — keine Bücher.',de:'Ich sehe keinen Bus.',ph:'ikh ZAY-uh KY-nun boos'},
 {k:'contrast',q:'<em>nein</em> vs. <em>nicht</em> vs. <em>kein</em> — which one answers a question?',o:['nein','nicht','kein','all three'],a:0,why:'Nein is the standalone answer word. Nicht and kein are built into the sentence itself.',de:'Nein, ich habe keine Zeit.',ph:'nyn, ikh HAH-buh KY-nuh tsyt'},
 {k:'trigger',q:'Which negator goes with <em>Das ist ein Problem</em>?',o:['nicht','kein','nein','either'],a:1,why:'The ein is right there to be replaced — Das ist kein Problem. Whenever you spot ein, reach for kein.',de:'Das ist kein Problem.',ph:'dass ist kyn pro-BLAYM'}
],
akk:[
 {k:'rule',q:'Which gender <em>visibly changes</em> in the accusative?',o:['All four','Only masculine','Only feminine','Only neuter'],a:1,why:'der → den, ein → einen. Feminine, neuter and plural articles look identical to the nominative. This one change carries most of the accusative workload.',de:'Ich sehe den Mann.',ph:'ikh ZAY-uh dayn mahn'},
 {k:'rule',q:'What role does the accusative mark?',o:['The subject','The direct object','Possession','Location'],a:1,why:'The accusative is the thing being acted upon — the answer to wen? or was?. The subject stays nominative.',de:'Der Hund beißt den Mann.',ph:'dair hoont bysst dayn mahn'},
 {k:'trigger',q:'Which set of prepositions <em>always</em> takes accusative?',o:['aus, bei, mit, nach','durch, für, ohne, gegen, um','in, an, auf','seit, von, zu'],a:1,why:'Durch, für, ohne, gegen, um (and bis) are fixed accusative. Mnemonic: DOGFU. They never switch.',de:'Ein Geschenk für den Vater.',ph:'yn guh-SHENK fuer dayn FAH-tur'},
 {k:'rule',q:'In accusative, <em>ein</em> becomes ___ before a masculine noun.',o:['eine','einem','einen','eines'],a:2,why:'Same -n signature as der → den. Kein and the possessives (mein, dein, sein...) follow the identical pattern: keinen, meinen.',de:'Ich kaufe einen Tisch.',ph:'ikh KOW-fuh Y-nun tish'},
 {k:'contrast',q:'Why does word order not tell you who did what in German?',o:['Because verbs move','Because the case ending marks the roles','Because articles are optional','It actually does'],a:1,why:'Den Mann beißt der Hund still means the dog bites the man — den flags the object no matter where it sits. Case does the job English gives to position.',de:'Den Mann beißt der Hund.',ph:'dayn mahn bysst dair hoont'},
 {k:'trigger',q:'Which of these verbs takes a <em>dative</em> object, breaking the accusative default?',o:['sehen','kaufen','helfen','haben'],a:2,why:'Helfen, danken, gehören, gefallen, antworten and passen take dative. They are memorized exceptions to the accusative default.',de:'Ich helfe dir.',ph:'ikh HEL-fuh deer'},
 {k:'rule',q:'What happens to <em>er</em> as an accusative pronoun?',o:['It stays er','It becomes ihm','It becomes ihn','It becomes sein'],a:2,why:'ich→mich, du→dich, er→ihn, sie→sie, es→es, wir→uns, ihr→euch, sie/Sie→sie/Sie. Again only masculine visibly shifts.',de:'Ich kenne ihn gut.',ph:'ikh KEN-uh een goot'},
 {k:'trigger',q:'Which case follows <em>es gibt</em>?',o:['Nominative','Accusative','Dative','Genitive'],a:1,why:'Es gibt is always followed by accusative: Es gibt einen Supermarkt hier. Treat it as a fixed accusative trigger.',de:'Es gibt einen Supermarkt.',ph:'ess gipt Y-nun ZOO-pur-markt'}
],
modal:[
 {k:'rule',q:'What happens to the <em>second</em> verb when a modal is used?',o:['It is conjugated too','It goes to the end as an infinitive','It is dropped','It moves to position 1'],a:1,why:'Only the modal conjugates. The main verb sits at the very end in its plain infinitive form, closing the bracket.',de:'Ich will heute schwimmen gehen.',ph:'ikh vil HOY-tuh SHVI-mun GAY-un'},
 {k:'rule',q:'Which two modal forms are <em>identical</em>?',o:['ich and du','ich and er/sie/es','du and ihr','wir and ihr'],a:1,why:'Modals drop the usual -e and -t in the singular: ich kann / er kann, ich muss / er muss. That symmetry is a signature of the modal group.',de:'Ich kann. Er kann.',ph:'ikh kan — air kan'},
 {k:'rule',q:'What happens to the stem vowel in the <em>singular</em> of most modals?',o:['Nothing','It changes (können → kann)','It doubles','It disappears'],a:1,why:'können→kann, müssen→muss, dürfen→darf, wollen→will, mögen→mag. Sollen is the odd one out — no change.',de:'Ich darf, wir dürfen.',ph:'ikh darf, veer DUER-fun'},
 {k:'contrast',q:'<em>können</em> vs. <em>dürfen</em> — what separates them?',o:['Formality','Ability vs. permission','Present vs. past','Singular vs. plural'],a:1,why:'Können = I am able. Dürfen = I am allowed. Ich kann schwimmen (I can swim) vs. Ich darf schwimmen (I am permitted to).',de:'Ich kann schwimmen. Ich darf schwimmen.',ph:'ikh kan SHVI-mun — ikh darf SHVI-mun'},
 {k:'contrast',q:'<em>müssen</em> vs. <em>sollen</em> — what is the difference in force?',o:['Both mean the same','Müssen is internal necessity, sollen is someone else’s instruction','Sollen is stronger','Müssen is only for the past'],a:1,why:'Müssen = it is necessary, no way around it. Sollen = someone says you should — advice, an order relayed from elsewhere.',de:'Ich muss arbeiten. Du sollst schlafen.',ph:'ikh mooss AR-by-tun — doo zolst SHLAH-fun'},
 {k:'contrast',q:'<em>nicht müssen</em> vs. <em>nicht dürfen</em> — what does each actually mean?',o:['Both mean "must not"','Don’t have to vs. must not','Both mean "don’t have to"','Cannot vs. will not'],a:1,why:'This trips up English speakers constantly. Du musst nicht = you are free not to. Du darfst nicht = it is forbidden.',de:'Du musst nicht kommen. Du darfst nicht rauchen.',ph:'doo moost nikht KO-mun — doo darfst nikht ROW-khun'},
 {k:'trigger',q:'Which modal is the polite one for ordering in a café?',o:['wollen','möchten','müssen','sollen'],a:1,why:'Möchten is the softened form of mögen and is the standard polite request. Ich will sounds demanding.',de:'Ich möchte einen Kaffee, bitte.',ph:'ikh MURKH-tuh Y-nun KAH-fay, BI-tuh'},
 {k:'rule',q:'Can a modal verb stand alone, without a second verb?',o:['Never','Yes, when the meaning is obvious','Only in questions','Only with sein'],a:1,why:'Ich kann Deutsch or Ich muss nach Hause work fine — the infinitive (sprechen, gehen) is understood and dropped.',de:'Ich muss nach Hause.',ph:'ikh mooss nakh HOW-zuh'}
],
poss:[
 {k:'rule',q:'Possessive articles take the same endings as which word?',o:['der','ein / kein','nicht','the verb'],a:1,why:'mein, dein, sein, ihr, unser, euer, ihr/Ihr all decline exactly like ein and kein — which is why accusative was worth learning first.',de:'Das ist mein Buch.',ph:'dass ist myn bookh'},
 {k:'contrast',q:'What decides between <em>sein</em> and <em>ihr</em>?',o:['The gender of the possessed thing','The gender of the owner','The case','The number'],a:1,why:'The stem points at the owner: sein = his, ihr = her/their. The ending then agrees with the thing owned. Two independent decisions.',de:'Anna und ihr Bruder. Max und sein Bruder.',ph:'AH-nah oont eer BROO-dur'},
 {k:'trigger',q:'Anna’s father — how do you say it with a possessive?',o:['sein Vater','ihr Vater','ihre Vater','seinen Vater'],a:1,why:'Owner is female → ihr. Vater is masculine nominative → no ending. Result: ihr Vater.',de:'Das ist ihr Vater.',ph:'dass ist eer FAH-tur'},
 {k:'rule',q:'What ending does a possessive take before a <em>masculine accusative</em> noun?',o:['-e','-en','no ending','-em'],a:1,why:'Ich sehe meinen Bruder. Same -en as den and einen. It is the single most common possessive ending mistake.',de:'Ich sehe meinen Bruder.',ph:'ikh ZAY-uh MY-nun BROO-dur'},
 {k:'rule',q:'What happens to <em>euer</em> when an ending is added?',o:['Nothing','The middle -e drops out','It doubles the r','It becomes eier'],a:1,why:'euer + e → eure, not euere. The stem loses its second e for pronounceability: eure Mutter, euren Vater.',de:'Wo ist eure Mutter?',ph:'voh ist OY-ruh MOO-tur'},
 {k:'contrast',q:'<em>ihr</em> vs. <em>Ihr</em> — what does the capital signal?',o:['Start of a sentence','Formal "your"','Plural','Emphasis'],a:1,why:'Capitalized Ihr mid-sentence is always the formal your. Lowercase ihr is her or their.',de:'Ist das Ihr Auto?',ph:'ist dass eer OW-toh'},
 {k:'rule',q:'Which noun does the possessive ending agree with?',o:['The owner','The thing possessed','Neither','Both'],a:1,why:'The ending is dictated by the gender, number and case of the thing owned — never by the owner. The owner only picks the stem.',de:'ihr Bruder / ihre Schwester',ph:'eer BROO-dur / EE-ruh SHVES-tur'},
 {k:'trigger',q:'What is the possessive for formal <em>Sie</em>?',o:['ihr','sein','Ihr','euer'],a:2,why:'Sie → Ihr, always capitalized. Wie ist Ihr Name? is the standard formal question.',de:'Wie ist Ihr Name?',ph:'vee ist eer NAH-muh'}
],
imp:[
 {k:'rule',q:'How do you build the <em>du</em>-imperative?',o:['Use the infinitive','Take the du-form, drop -st and drop the pronoun','Add -en to the stem','Put the verb last'],a:1,why:'du kommst → Komm! The pronoun disappears entirely, and the verb leads the sentence.',de:'Komm her!',ph:'kom hair'},
 {k:'rule',q:'How is the <em>Sie</em>-imperative different from the other two?',o:['It drops the verb','It keeps the pronoun, placed after the verb','It uses the du-form','It needs bitte'],a:1,why:'Kommen Sie! — the only imperative that keeps its pronoun. It looks exactly like a yes/no question minus the question mark.',de:'Kommen Sie bitte herein!',ph:'KO-mun zee BI-tuh hair-YN'},
 {k:'rule',q:'How do you form the <em>ihr</em>-imperative?',o:['Present ihr-form minus the pronoun','Infinitive','Add -e to the stem','Same as du'],a:0,why:'ihr kommt → Kommt! Identical to the present tense form, just with the pronoun deleted.',de:'Kommt schnell!',ph:'komt shnel'},
 {k:'trigger',q:'Which stem change <em>survives</em> into the du-imperative?',o:['a → ä','e → i / ie','o → ö','None of them'],a:1,why:'nehmen → Nimm! and sehen → Sieh! keep the change. But a→ä is dropped: fahren → Fahr!, not Fähr!',de:'Nimm das! Fahr langsam!',ph:'nim dass — fahr LAHNG-zahm'},
 {k:'rule',q:'Where does a separable prefix go in an imperative?',o:['Attached to the verb','At the very end','It is dropped','Before the verb'],a:1,why:'The verb leads, the prefix closes: Ruf mich an! Steh auf! The bracket rule applies to commands too.',de:'Ruf mich an!',ph:'roof mikh an'},
 {k:'contrast',q:'What are the three imperatives of <em>sein</em>?',o:['Sei! Seid! Seien Sie!','Bin! Bist! Sind!','Sein! Seint! Seien!','Ist! Seid! Sind Sie!'],a:0,why:'Sein is irregular here as everywhere. Sei ruhig! Seid ruhig! Seien Sie ruhig!',de:'Sei ruhig!',ph:'zy ROO-ikh'},
 {k:'rule',q:'What is the simplest way to soften a German command?',o:['Use the infinitive','Add bitte or mal','Use Sie','Add a question mark'],a:1,why:'Bitte and the little particle mal take the edge off: Komm mal her. Warten Sie bitte. Germans use imperatives freely once softened.',de:'Warten Sie bitte einen Moment.',ph:'VAR-tun zee BI-tuh Y-nun mo-MENT'}
],
trenn:[
 {k:'rule',q:'In a main clause, where does the separable <em>prefix</em> go?',o:['Stays on the verb','At the very end of the clause','Directly after the subject','Position 1'],a:1,why:'The verb conjugates in position 2 and the prefix is flung to the end. Everything in between is inside the bracket.',de:'Ich rufe dich später an.',ph:'ikh ROO-fuh dikh SHPAY-tur an'},
 {k:'rule',q:'What happens to a separable verb after a <em>modal</em>?',o:['It still splits','It stays whole as an infinitive at the end','The prefix moves to position 2','The modal splits instead'],a:1,why:'Nothing splits an infinitive. Ich muss dich anrufen — anrufen stays intact at the end because the modal is doing the conjugating.',de:'Ich muss dich anrufen.',ph:'ikh mooss dikh AN-roo-fun'},
 {k:'rule',q:'Where does <em>ge-</em> go in the Perfekt of a separable verb?',o:['At the front','Between the prefix and the stem','At the end','It is left out'],a:1,why:'anrufen → angerufen. aufstehen → aufgestanden. The ge- is sandwiched inside the word.',de:'Ich habe dich angerufen.',ph:'ikh HAH-buh dikh AN-guh-roo-fun'},
 {k:'trigger',q:'Which of these prefixes is <em>inseparable</em>?',o:['an-','auf-','ver-','mit-'],a:2,why:'The inseparable set: be-, ver-, er-, ent-, ge-, emp-, miss-, zer-. They never detach and never take ge- in the Perfekt.',de:'Ich verstehe das nicht.',ph:'ikh fair-SHTAY-uh dass nikht'},
 {k:'rule',q:'What is the reliable spoken clue that a prefix separates?',o:['It is short','It carries the stress','It starts with a vowel','It is a preposition'],a:1,why:'Stressed prefix = separable (ANrufen). Unstressed = inseparable (verSTEhen). Listening tells you before the grammar does.',de:'ANrufen vs. verSTEHEN',ph:'AN-roo-fun vs. fair-SHTAY-un'},
 {k:'trigger',q:'Which of these separates: <em>besuchen</em>, <em>einkaufen</em>, <em>erklären</em>?',o:['besuchen','einkaufen','erklären','All of them'],a:1,why:'ein- is separable: Ich kaufe ein. Be- and er- are inseparable, and neither takes ge- in the Perfekt (besucht, erklärt).',de:'Ich kaufe im Supermarkt ein.',ph:'ikh KOW-fuh im ZOO-pur-markt yn'},
 {k:'rule',q:'In a yes/no question with a separable verb, where does the prefix sit?',o:['With the verb in position 1','Still at the end','It is dropped','Before the subject'],a:1,why:'Rufst du mich an? The verb leads, the prefix still anchors the end. The bracket holds in every clause type.',de:'Rufst du mich an?',ph:'roofst doo mikh an'},
 {k:'rule',q:'Where does <em>nicht</em> go with a separable verb?',o:['After the prefix','Directly before the prefix','At the front','Between subject and verb'],a:1,why:'Ich rufe dich nicht an. The prefix is the last element, so nicht slides in just ahead of it.',de:'Ich rufe dich nicht an.',ph:'ikh ROO-fuh dikh nikht an'}
],
dat:[
 {k:'trigger',q:'Which group <em>always</em> takes the dative?',o:['durch, für, ohne, gegen, um','aus, bei, mit, nach, seit, von, zu','in, an, auf, über','bis, entlang'],a:1,why:'Aus, bei, mit, nach, seit, von, zu (plus gegenüber and ab). No exceptions, no switching — worth memorizing as a chant.',de:'Ich fahre mit dem Bus.',ph:'ikh FAH-ruh mit daym boos'},
 {k:'rule',q:'What are the dative articles for der / die / das?',o:['den / die / das','dem / der / dem','der / dem / der','des / der / des'],a:1,why:'Masculine and neuter both go to dem; feminine goes to der. Plural becomes den, and the noun itself adds an -n.',de:'mit dem Mann, mit der Frau',ph:'mit daym mahn, mit dair frow'},
 {k:'rule',q:'What extra thing happens to <em>plural</em> nouns in the dative?',o:['Nothing','The noun adds -n','The article drops','The noun capitalizes twice'],a:1,why:'die Kinder → mit den Kindern. If the plural does not already end in -n or -s, you add one.',de:'mit den Kindern',ph:'mit dayn KIN-durn'},
 {k:'contrast',q:'<em>nach</em> vs. <em>zu</em> — which goes with cities and countries?',o:['zu','nach','either','neither'],a:1,why:'Nach for cities, countries without an article, and nach Hause. Zu for people, businesses and specific places: zum Arzt, zur Schule.',de:'Ich fahre nach Berlin. Ich gehe zum Arzt.',ph:'ikh FAH-ruh nakh bair-LEEN'},
 {k:'rule',q:'What does <em>zu dem</em> contract to?',o:['zum','zur','zudem','zem'],a:0,why:'zu dem → zum, zu der → zur, bei dem → beim, von dem → vom, in dem → im. These contractions are the default, not optional style.',de:'Ich gehe zum Bahnhof.',ph:'ikh GAY-uh tsoom BAHN-hohf'},
 {k:'contrast',q:'<em>bei</em> vs. <em>mit</em> — what does each express?',o:['At someone’s place / together with','Direction / origin','Time / manner','They are the same'],a:0,why:'Bei = at, with, in the vicinity of (bei meiner Mutter, bei der Arbeit). Mit = accompanied by or by means of (mit dem Zug).',de:'Ich wohne bei meiner Mutter.',ph:'ikh VOH-nuh by MY-nur MOO-tur'},
 {k:'rule',q:'What are the dative forms of <em>ich</em> and <em>du</em>?',o:['mich / dich','mein / dein','mir / dir','ich / du'],a:2,why:'mir, dir, ihm, ihr, ihm, uns, euch, ihnen/Ihnen. Compare accusative mich/dich — the r is the dative signal.',de:'Kannst du mir helfen?',ph:'kanst doo meer HEL-fun'},
 {k:'trigger',q:'What does <em>seit</em> + dative tell you about the action?',o:['It finished in the past','It started in the past and is still going','It will start soon','It happens repeatedly'],a:1,why:'Seit + present tense describes something ongoing: Ich lerne seit zwei Jahren Deutsch — and still am. English would use a perfect tense here.',de:'Ich wohne seit drei Jahren hier.',ph:'ikh VOH-nuh zyt dry YAH-run heer'},
 {k:'trigger',q:'Which of these prepositions does <em>not</em> take dative?',o:['aus','für','von','seit'],a:1,why:'Für belongs to the accusative group (durch, für, ohne, gegen, um). The rest are core dative prepositions.',de:'ein Geschenk für dich',ph:'yn guh-SHENK fuer dikh'}
],
perf:[
 {k:'rule',q:'How is the Perfekt structured in a main clause?',o:['Participle in position 2, helper at the end','Helper verb in position 2, participle at the end','Both verbs together','Participle first'],a:1,why:'haben or sein conjugates in position 2, the Partizip II closes the sentence. Same bracket shape as modals and separable verbs.',de:'Ich habe gestern Fußball gespielt.',ph:'ikh HAH-buh GES-turn FOOSS-bal guh-SHPEELT'},
 {k:'trigger',q:'Which verbs take <em>sein</em> as the helper?',o:['All verbs with objects','Verbs of movement or change of state, plus sein and bleiben','Only irregular verbs','Only separable verbs'],a:1,why:'gehen, fahren, kommen, laufen (movement), aufstehen, einschlafen, werden (change of state), plus sein and bleiben. Everything else uses haben.',de:'Ich bin nach Hause gegangen.',ph:'ikh bin nakh HOW-zuh guh-GAHNG-un'},
 {k:'rule',q:'How do you build a <em>regular</em> Partizip II?',o:['ge + stem + en','ge + stem + t','stem + te','ge + infinitive'],a:1,why:'machen → gemacht, spielen → gespielt. Irregular verbs instead use ge + stem + en, often with a vowel change: gehen → gegangen.',de:'Ich habe das gemacht.',ph:'ikh HAH-buh dass guh-MAKHT'},
 {k:'trigger',q:'Which verbs take <em>no ge-</em> in the participle?',o:['Verbs ending in -ieren and verbs with inseparable prefixes','Verbs starting with a vowel','Modal verbs','Plural verbs'],a:0,why:'studieren → studiert, verstehen → verstanden, besuchen → besucht. Both groups are unstressed on the first syllable, which is why ge- is blocked.',de:'Ich habe Medizin studiert.',ph:'ikh HAH-buh may-di-TSEEN shtoo-DEERT'},
 {k:'contrast',q:'Why is it <em>ich habe gespielt</em> but <em>ich bin gefahren</em>?',o:['Fahren is irregular','Fahren expresses movement from A to B','Spielen is separable','No reason, memorize it'],a:1,why:'Motion to a new place triggers sein. Careful: with a direct object, fahren flips to haben — Ich habe das Auto gefahren.',de:'Ich bin nach Köln gefahren.',ph:'ikh bin nakh kurln guh-FAH-run'},
 {k:'rule',q:'Where does <em>ge-</em> sit in the participle of <em>aufstehen</em>?',o:['At the very front','Between auf and stehen','At the end','It is omitted'],a:1,why:'aufgestanden. Separable prefix, then ge-, then the stem. Compare inseparable verstanden, which takes no ge- at all.',de:'Ich bin früh aufgestanden.',ph:'ikh bin frue OWF-guh-shtan-dun'},
 {k:'rule',q:'What does the Perfekt actually replace in spoken German?',o:['The future','The everyday past tense','The imperative','The conditional'],a:1,why:'Spoken German uses the Perfekt for almost all past events. The Präteritum survives mainly in writing and with sein, haben and modals.',de:'Was hast du gestern gemacht?',ph:'vass hast doo GES-turn guh-MAKHT'},
 {k:'trigger',q:'Which helper does <em>bleiben</em> take, despite involving no movement?',o:['haben','sein','either','werden'],a:1,why:'Sein and bleiben are the two lexical exceptions to the movement rule. Ich bin zu Hause geblieben.',de:'Ich bin zu Hause geblieben.',ph:'ikh bin tsoo HOW-zuh guh-BLEE-bun'},
 {k:'rule',q:'Where does <em>nicht</em> go in a Perfekt sentence?',o:['After the participle','Directly before the participle','After the helper verb','At the start'],a:1,why:'Ich habe das Buch nicht gelesen. The participle owns the final slot, so nicht sits just in front of it.',de:'Ich habe das nicht gesehen.',ph:'ikh HAH-buh dass nikht guh-ZAY-un'}
]
};

const m1=E("Von: Maria","Liebe Anna,\ndanke für die Einladung zu deiner Party am Samstag. Ich komme sehr gern! Ich kann aber erst um 19 Uhr kommen, weil ich bis 18 Uhr arbeite. Soll ich einen Salat mitbringen?\nBis Samstag!\nMaria");

const SRS_INTERVALS = { a1: [0, 1, 2, 4, 8, 16], fach: [0, 1, 3, 7, 16, 35], antrag: [0, 1, 3, 7, 16, 35], verben: [0, 1, 3, 7, 16, 35] };

function srsDeckStats(deck) {

function runQuiz({ title, back, pool, label, replay }) {
  const v = shell({ title, back, tab: "grammatik" });
  let queue = shuffle(pool), pos = 0, cur = null, locked = false;
  const S = { answered: 0, correct: 0, streak: 0, best: 0, missed: new Map() };
  function stats() { return `<div class="stats"><div><b>${S.streak}</b><span>Serie</span></div><div><b>${S.answered}</b><span>Beantwortet</span></div><div><b>${S.answered ? Math.round(S.correct / S.answered * 100) + "%" : "–"}</b><span>Genauigkeit</span></div></div>`; }
  function next() {
    hush();
    if (pos >= queue.length) { queue = shuffle(pool); pos = 0; }
    const q = queue[pos++]; const right = q.o[q.a];
    const opts = shuffle(q.o.map((txt, i) => ({ txt, i })));
    cur = { q, opts, right }; locked = false;
    const topicName = (gTopic(q.topic) || {}).title || "";
    const head = q.type === "rule"
      ? `<span class="kind ${q.k}">${q.k === "trigger" ? "Trigger" : q.k === "contrast" ? "Kontrast" : "Regel"}</span> <span class="muted small">${esc(topicName)}</span><p class="q">${q.q}</p>`
      : `<span class="kind">${esc(topicName)}</span><p class="q">${esc(q.q).replace(/___/g, '<span class="blank">___</span>')}</p>${q.t ? `<p class="tr">${esc(q.t)}</p>` : ""}`;
    v.innerHTML = stats() + `<div class="card">${head}<div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.txt)}</button>`).join("")}</div><div id="fb"></div></div>
      <button class="btn primary hidden" id="nextBtn">Weiter</button>
      <button class="btn ghost" id="endBtn">Session beenden</button>`;
    $$(".opt", v).forEach(b => b.onclick = () => answer(+b.dataset.i, b));
    $("#endBtn", v).onclick = recap;
    $("#nextBtn", v).onclick = next;
  }
  function answer(i, btn) {
    if (locked) return; locked = true;
    const { q, opts, right } = cur, ok = opts[i].i === q.a;
    S.answered++; if (ok) { S.correct++; S.streak++; S.best = Math.max(S.best, S.streak); } else { S.streak = 0; S.missed.set(q.q + "|" + right, q); }
    recordGram(q.topic, ok);
    $$(".opt", v).forEach((b, j) => { b.disabled = true; if (opts[j].i === q.a) { b.classList.add("ok"); b.insertAdjacentHTML("beforeend", '<span class="m">✓</span>'); } else if (b === btn) { b.classList.add("no"); b.insertAdjacentHTML("beforeend", '<span class="m">✕</span>'); } else b.classList.add("dim"); });
    const sayBtn = q.say && TTS ? `<button class="say" data-say="${esc(q.say)}">${SPK} Anhören</button>` : "";
    $("#fb", v).innerHTML = q.type === "rule"
      ? `<div class="fb"><b>${ok ? "Genau. " : ""}Die Regel:</b> ${esc(q.why)}${q.say ? `<div class="ex"><div class="de">${esc(q.say)}</div>${q.ph ? `<div class="ph">${esc(q.ph)}</div>` : ""}${sayBtn}</div>` : ""}</div>`
      : `<div class="fb"><b>${ok ? "Richtig!" : "Nicht ganz."}</b> ${q.x || ""}<div class="ex"><div class="de">${esc(q.say)}</div>${q.ph ? `<div class="ph">${esc(q.ph)}</div>` : ""}${sayBtn}</div></div>`;
    $(".stats", v).outerHTML = stats();
    $("#nextBtn", v).classList.remove("hidden");
    if (q.say && q.type === "drill") speak(q.say);
  }
  function recap() {
    hush();
    const acc = S.answered ? Math.round(S.correct / S.answered * 100) : 0, items = [...S.missed.values()];
    const verdict = !S.answered ? "Noch keine Antworten" : acc >= 95 ? "Perfekt!" : acc >= 80 ? "Sehr stark!" : acc >= 60 ? "Gut gemacht." : "Weiter üben!";
    v.innerHTML = `<div class="result"><div class="pct ${acc >= 80 ? "pass" : ""}">${S.answered ? acc + "%" : "–"}</div><div class="lbl">${verdict}</div><div class="sub">${label ? esc(label) + ", " : ""}${S.answered} beantwortet, beste Serie ${S.best}</div></div>
      ${items.length ? `<div class="h2">Wiederholen (${items.length})</div>` + items.map(q => `<div class="rev no"><div class="rq">${q.type === "rule" ? q.q : esc(q.q)}</div><div class="ra">Richtig: <b>${esc(q.o[q.a])}</b>${q.type === "drill" ? ", " + esc(q.say) : ""}</div></div>`).join("") : S.answered ? `<p class="empty">Keine Fehler in dieser Session.</p>` : ""}

    $("#more", v).onclick = () => runQuiz({ title, back, pool, label });
    const rp = $("#replay", v); if (rp) rp.onclick = () => runQuiz({ title: "Fehler wiederholen", back, pool: items, label: "Fehler" });
  }

}

route("/lesen/:tier/:i", (tier, i) => {
  const paper = (LESEN[tier] || [])[+i]; if (!paper) return go("/lesen");
  const v = shell({ title: paper.name, back: "/lesen", tab: "pruefung", right: '<span class="timer" id="timer">25:00</span>' });
  const ans = new Array(paper.q.length).fill(null); let cur = 0, left = 25 * 60, armed = false;
  const tick = setInterval(() => { left--; paintTimer(); if (left <= 0) finish(true); }, 1000);
  setCleanup(() => clearInterval(tick));
  function paintTimer() { const t = $("#timer"); if (!t) return; t.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); t.classList.toggle("warn", left <= 120); }
  function draw() {
    const q = paper.q[cur], c = ans[cur];
    let reading = "";
    if (q.text) reading = q.text.sign
      ? `<div class="sign">${spkBtn(q.text.body)}<div class="i">${q.text.icon || ""}</div><div class="body">${esc(q.text.body)}</div></div>`
      : `<div class="text"><div class="from"><span>${esc(q.text.who)}</span>${spkBtn(q.text.body)}</div><div class="body">${esc(q.text.body)}</div></div>`;
    const input = q.type === "rf"
      ? `<div class="prompt"><small>Richtig oder falsch?</small>${esc(q.prompt)}</div><div class="rf"><button data-rf="1" class="${c === true ? "sel" : ""}">✓ Richtig</button><button data-rf="0" class="${c === false ? "sel" : ""}">✕ Falsch</button></div>`
      : `<div class="prompt"><small>Welche Anzeige passt?</small>${esc(q.prompt)}</div>${["a", "b"].map(k => `<button class="ad ${c === k ? "sel" : ""}" data-ab="${k}"><span class="b">${k}</span><span>${esc(q[k])}</span></button>`).join("")}`;
    const last = cur === paper.q.length - 1, open = ans.filter(a => a == null).length;
    v.innerHTML = `<div class="teil"><span class="tag">Teil ${q.teil}</span><span class="sub">${TEIL[q.teil]}</span><span class="qn">Frage ${cur + 1}/15</span></div>${reading}${input}
      <div class="dots">${paper.q.map((_, j) => `<button class="dot ${ans[j] != null ? "a" : ""} ${j === cur ? "c" : ""}" data-j="${j}" aria-label="Frage ${j + 1}">${j + 1}</button>`).join("")}</div>
      <div class="row2"><button class="btn ghost" id="prev" ${cur === 0 ? "disabled" : ""}>Zurück</button>${last ? `<button class="btn primary" id="sub">Abgeben</button>` : `<button class="btn petrol" id="nxt">Weiter</button>`}</div>
      ${armed && open ? `<p class="note">${open} Frage(n) noch offen. Tippe nochmal auf Abgeben, um trotzdem abzugeben.</p>` : ""}`;
    $$("[data-rf]", v).forEach(b => b.onclick = () => { ans[cur] = b.dataset.rf === "1"; draw(); });
    $$("[data-ab]", v).forEach(b => b.onclick = () => { ans[cur] = b.dataset.ab; draw(); });
    $$("[data-j]", v).forEach(b => b.onclick = () => { cur = +b.dataset.j; armed = false; draw(); window.scrollTo(0, 0); });
    const p = $("#prev", v); if (p) p.onclick = () => { cur--; draw(); window.scrollTo(0, 0); };
    const n = $("#nxt", v); if (n) n.onclick = () => { cur++; draw(); window.scrollTo(0, 0); };
    const s = $("#sub", v); if (s) s.onclick = () => { if (open && !armed) { armed = true; draw(); return; } finish(false); };
  }
  function finish(byTime) {
    clearInterval(tick); hush();
    let correct = 0; const per = { 1: [0, 0], 2: [0, 0], 3: [0, 0] };
    paper.q.forEach((q, j) => { per[q.teil][1]++; if (ans[j] === q.answer) { correct++; per[q.teil][0]++; } });
    const key = tier + i; DB.lesen[key] = Math.max(DB.lesen[key] || 0, correct); logActivity(15); save();
    const t = $("#timer"); if (t) t.remove();
    const verdict = correct >= 14 ? "Ausgezeichnet!" : correct >= 12 ? "Sehr gut!" : correct >= 9 ? "Bestanden" : "Fast geschafft";
    v.innerHTML = `<div class="result"><div class="pct ${correct >= 9 ? "pass" : ""}">${correct}/15</div><div class="lbl">${verdict}</div><div class="sub">${byTime ? "Zeit abgelaufen. " : ""}${correct >= 9 ? "Above the pass line." : "Read the explanations below, then retry."}</div></div>
      <div class="breakdown">${[1, 2, 3].map(n => `<div><b class="${per[n][0] < Math.ceil(per[n][1] * .6) ? "low" : ""}">${per[n][0]}/${per[n][1]}</b><span>Teil ${n}</span></div>`).join("")}</div>
      ${paper.q.map((q, j) => {
      const ok = ans[j] === q.answer, show = x => x == null ? "–" : q.type === "rf" ? (x ? "Richtig" : "Falsch") : x;
      return `<div class="rev ${ok ? "" : "no"}"><div class="rq">${j + 1}. ${esc(q.prompt)}</div><div class="ra">Deine Antwort: <b>${show(ans[j])}</b>${ok ? "" : `, richtig: <b>${show(q.answer)}</b>`}</div><div class="rx">${esc(q.ex).replace(esc(q.kw), `<span class="kw">${esc(q.kw)}</span>`)}</div></div>`;
    }).join("")}
      <div class="row2"><button class="btn ghost" data-go="/lesen">Anderer Satz</button><button class="btn primary" id="again">Wiederholen</button></div>`;
    $("#again", v).onclick = () => render();
    window.scrollTo(0, 0);
  }
  paintTimer(); draw();
});

      id: i, de: w.pos === "noun" && !w.pluralOnly ? w.art + " " + w.de : w.de, base: w.de, art: w.pos === "noun" && !w.pluralOnly ? w.art : null,
      en: w.en.join(", "), enList: w.en, pl: w.pl && w.pl !== "—" ? w.pl : "", note: "", g: w.cat, pos: w.pos, ex: w.ex
    })),
    modes: {
      artikel: { label: "Artikel", desc: "der, die oder das" },
      verstehen: { label: "Verstehen", desc: "Type the meaning, direction toggle", dir: true },
      auswahl: { label: "Auswahl", desc: "Multiple choice, direction toggle", dir: true },
      paare: { label: "Paare", desc: "Match 5 pairs" }
    }
  }
};
function vEligible(deck, mode, group) {
  return DECKS[deck].words.filter(w => {
    if (group !== "all" && w.g !== group) return false;
    if (mode === "artikel") return !!w.art;
    if (mode === "schreiben" || mode === "hoeren") return !(w.de.endsWith("-") || w.de.includes("/") || w.de.includes(","));
    return true;
  });
}
function checkDE(input, w) {
  let s = String(input || "").trim(); const m = s.match(/^(der|die|das)\s+(.+)$/i);
  if (m) { if (w.art && m[1].toLowerCase() !== w.art) return false; s = m[2]; }
  return lenient(s, w.base) || lenient(input, w.de);
}
function checkEN(input, w) {
  const clean = x => fold(x).replace(/^to /, "").replace(/\(.*?\)/g, "").trim();
  const u = clean(input); if (!u) return false;
  const opts = w.enList.flatMap(e => e.split(/\s*[\/,]\s*/)).map(clean).filter(Boolean);
  return opts.some(o => o === u || lev(o, u) <= (o.length > 6 ? 2 : o.length > 3 ? 1 : 0));
}

function buildVQueue(deck, mode, group, size) {
  const now = endOfToday(), due = [], fresh = [], later = [];
  vEligible(deck, mode, group).forEach(w => { const p = srsGet(deck, mode, w.id); if (p.lvl === 0) fresh.push(w); else if (p.due <= now) due.push(w); else later.push(w); });
  let q = shuffle(due).concat(shuffle(fresh));
  if (size === "all") return q.concat(shuffle(later));
  if (q.length < size) q = q.concat(shuffle(later).slice(0, size - q.length));
  return q.slice(0, size);
}

    let card = "", ctrl = "";

      ctrl = `<button class="btn petrol" id="show">Antwort zeigen</button><div class="row2 hidden" id="rate"><button class="btn bad" data-ok="0">Nicht gewusst</button><button class="btn good" data-ok="1">Gewusst</button></div>`;

    } else if (mode === "verstehen") {

}

function runPairs(deck, P) {
  const D = DECKS[deck], v = shell({ title: "Paare", back: "/wortschatz/" + deck, tab: "wortschatz" });
  const queue = buildVQueue(deck, "paare", P.group, 5); let sel = null, done = 0; const firstTry = new Map();
  const L = shuffle(queue), R = shuffle(queue);
  v.innerHTML = `<p class="muted" style="margin:2px 2px 10px">Tap a German word, then its meaning.</p><div class="pairs"><div class="col">${L.map(w => `<button class="pc de" data-id="${w.id}" data-s="L">${esc(w.de)}</button>`).join("")}</div><div class="col">${R.map(w => `<button class="pc" data-id="${w.id}" data-s="R">${esc(w.en)}</button>`).join("")}</div></div><div id="out"></div>`;
  $$(".pc", v).forEach(c => c.onclick = () => {
    if (c.classList.contains("ok")) return;
    if (c.dataset.s === "L") speak(c.textContent);
    if (!sel) { sel = c; c.classList.add("sel"); return; }
    if (sel === c) { c.classList.remove("sel"); sel = null; return; }
    if (sel.dataset.s === c.dataset.s) { sel.classList.remove("sel"); sel = c; c.classList.add("sel"); return; }
    const id = +c.dataset.id;
    if (sel.dataset.id === c.dataset.id) {
      sel.classList.remove("sel"); sel.classList.add("ok"); c.classList.add("ok"); done++;
      const w = queue.find(x => x.id === id); if (!firstTry.has(id)) firstTry.set(id, true); srsGrade(deck, "paare", id, firstTry.get(id)); save();
      if (done === queue.length) { const r = [...firstTry.values()].filter(Boolean).length; $("#out", v).innerHTML = `<div class="result"><div class="pct ${r === queue.length ? "pass" : ""}">${r}/${queue.length}</div><div class="lbl">first try</div></div><div class="row2"><button class="btn ghost" data-go="/wortschatz/${deck}">Zurück</button><button class="btn primary" id="again">Nächste 5</button></div>`; $("#again", v).onclick = () => runPairs(deck, P); }
    } else {
      [+sel.dataset.id, id].forEach(x => firstTry.set(x, false));
      const a = sel, b = c; a.classList.remove("sel"); a.classList.add("no"); b.classList.add("no"); setTimeout(() => { a.classList.remove("no"); b.classList.remove("no"); }, 380);
    }
    sel = null;
  });
}
