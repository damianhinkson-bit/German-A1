route("/verben/:mode", mode => {
  if (!ANTRAG_ON || !VMODES[mode]) return go("/verben");
  const v = shell({ title: VMODES[mode].label, back: "/verben", tab: "wortschatz" });
  const now = endOfToday(), due = [], fresh = [], later = [];
  vbList().forEach(x => { const p = srsGet("verben", mode, x.id); (p.lvl === 0 ? fresh : p.due <= now ? due : later).push(x); });
  const queue = shuffle(due).concat(shuffle(fresh)).concat(shuffle(later)).slice(0, 10);
  let pos = 0; const seen = new Map();
  const PR = { ich: "ich", du: "du", er: "er / sie", wir: "wir", ihr: "ihr" };
  function grade(x, ok) { srsGrade("verben", mode, x.id, ok); save(); const s = seen.get(x.id); seen.set(x.id, { x, ok: s ? s.ok && ok : ok }); if (!ok) queue.splice(Math.min(pos + 3, queue.length), 0, x); }
  function ans(x, extra = "") { return `<div class="ans hidden" id="ans"><div class="a1">${esc(x.inf)}</div><div class="a2">${esc(x.en)}</div>${extra}<div class="a3">${esc(x.note)}</div><div class="a4">${esc(x.exDe)}<br><span class="muted">${esc(x.exEn)}</span></div></div>`; }
  function reveal(sayText) { $("#ans", v).classList.remove("hidden"); const n = $("#nx", v); n.classList.remove("hidden"); n.onclick = () => { pos++; draw(); }; if (sayText) speak(sayText); }
  function typed(x, target, sayText) {
    const inp = $("#in", v); setTimeout(() => { try { inp.focus(); } catch (e) { } }, 60);
    const check = skip => { if (inp.disabled) return; inp.disabled = true; const ok = !skip && lenient(inp.value, target); inp.classList.add(ok ? "ok" : "no"); $("#chk", v).classList.add("hidden"); $("#skip", v).classList.add("hidden"); grade(x, ok); reveal(sayText); };
    $("#chk", v).onclick = () => check(false); $("#skip", v).onclick = () => check(true);
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); inp.disabled ? $("#nx", v).click() : check(false); } };
  }
  const INPUT = `<input class="input" id="in" style="margin-top:14px;text-align:center;font-size:19px;font-weight:700" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Hier tippen"><button class="btn petrol" id="chk">Prüfen</button><button class="btn ghost" id="skip">Weiß ich nicht</button><button class="btn primary hidden" id="nx">Weiter</button>`;
  function draw() {
    hush();
    if (pos >= queue.length) {
      const arr = [...seen.values()], r = arr.filter(s => s.ok).length;
      v.innerHTML = `<div class="result"><div class="pct ${r === arr.length ? "pass" : ""}">${r}/${arr.length}</div><div class="lbl">right first time</div></div>${arr.map(s => `<div class="rev ${s.ok ? "" : "no"}"><div class="rq">${esc(s.x.inf)}</div><div class="ra">${esc(s.x.en)}, ${esc(s.x.aux)} ${esc(s.x.part)}</div></div>`).join("")}<div class="row2"><button class="btn ghost" data-go="/verben">Zurück</button><button class="btn primary" id="ag">Nochmal</button></div>`;
      $("#ag", v).onclick = () => render(); return;
    }
    const x = queue[pos], top = `<p class="muted small" style="margin:2px">${pos + 1} / ${queue.length}</p>`;
    if (mode === "bedeutung") {
      const opts = shuffle([x].concat(shuffle(vbList().filter(y => y.id !== x.id)).slice(0, 3)));
      v.innerHTML = top + `<div class="vc">${spkBtn(x.inf)}<div class="pr">Was bedeutet das?</div><div class="w">${esc(x.inf)}</div>${ans(x)}</div><div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(o.en)}</button>`).join("")}</div><button class="btn primary hidden" id="nx">Weiter</button>`;
      $$(".opt", v).forEach(b => b.onclick = () => { if (b.disabled) return; const ok = +b.dataset.id === x.id; $$(".opt", v).forEach(y => { y.disabled = true; if (+y.dataset.id === x.id) y.classList.add("ok"); else if (y === b) y.classList.add("no"); else y.classList.add("dim"); }); grade(x, ok); reveal(x.inf); });
    } else if (mode === "infinitiv") {
      v.innerHTML = top + `<div class="vc"><div class="pr">Auf Deutsch (Infinitiv)</div><div class="w sm">${esc(x.en)}</div>${ans(x)}</div>` + INPUT;
      typed(x, x.inf, x.inf);
    } else if (mode === "konj") {
      const p = shuffle(["ich", "du", "er", "wir", "ihr"])[0], right = x.forms[p];
      v.innerHTML = top + `<div class="vc"><div class="pr">${esc(x.inf)}, ${esc(x.en)}</div><div class="w sm">${PR[p]} ___</div>${x.sep ? `<div class="muted small" style="margin-top:6px">Separable: type both parts, e.g. baue an</div>` : ""}${ans(x, `<div class="a3" style="font-size:17px;color:var(--ink)">${PR[p]} <b>${esc(right)}</b></div>`)}</div>` + INPUT;
      typed(x, right, (p === "er" ? "er" : p) + " " + right);
    } else if (mode === "perfekt") {
      v.innerHTML = top + `<div class="vc"><div class="pr">${esc(x.inf)}, ${esc(x.en)}</div><div class="w sm">Ich habe … ___</div>${ans(x, `<div class="a3" style="font-size:17px;color:var(--ink)">ich habe … <b>${esc(x.part)}</b></div>`)}</div>` + INPUT;
      typed(x, x.part, "Ich habe " + x.part);
    } else {
      v.innerHTML = top + `<div class="vc"><div class="pr">Say it in German, with <b>${esc(x.inf)}</b></div><div class="w sm">${esc(x.exEn)}</div><div class="ans hidden" id="ans"><div class="a1" style="font-size:20px">${esc(x.exDe)}</div><div class="a3">${esc(x.note)}</div></div></div>
        <textarea class="ta" id="my" style="min-height:70px;margin-top:12px" placeholder="Say it out loud, or type it"></textarea>
        <button class="btn petrol" id="show">Antwort zeigen</button><div class="row2 hidden" id="rate"><button class="btn bad" data-ok="0">Nochmal üben</button><button class="btn good" data-ok="1">Konnte ich</button></div>`;
      $("#show", v).onclick = () => { $("#ans", v).classList.remove("hidden"); $("#show", v).remove(); $("#rate", v).classList.remove("hidden"); speak(x.exDe); };
      $$("#rate button", v).forEach(b => b.onclick = () => { grade(x, b.dataset.ok === "1"); pos++; draw(); });
    }
  }
  draw();
});

function runListenMC({ title, back, items, prompt, options, after, deck, mode }) {
  const v = shell({ title, back, tab: "pruefung" });

  const draw = () => {
    hush();
    if (i >= queue.length) { v.innerHTML = `<div class="result"><div class="pct ${right >= queue.length * .8 ? "pass" : ""}">${right}/${queue.length}</div><div class="lbl">richtig</div></div><div class="row2"><button class="btn ghost" data-go="${back}">Zurück</button><button class="btn primary" id="ag">Nochmal</button></div>`; $("#ag", v).onclick = () => render(); return; }
    const x = queue[i], opts = options(x);
    v.innerHTML = `<p class="muted small" style="margin:2px">${i + 1} / ${queue.length}</p><div class="vc"><div class="pr">${prompt}</div><button class="bigspk" id="play" aria-label="Abspielen">${SPK}</button><button class="btn ghost" id="txt" style="width:auto;padding:8px 14px;margin-top:12px">Text zeigen</button><div class="ans hidden" id="ans"><div class="a1" style="font-size:20px">${esc(x.de)}</div></div></div>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.label)}</button>`).join("")}</div><div id="fb"></div><button class="btn primary hidden" id="nx">Weiter</button>`;
    const play = () => { if (!speakSlow(x.de)) { const a_ = $("#ans", v); if (a_) a_.classList.remove("hidden"); }; };
    $("#play", v).onclick = play; setTimeout(play, 200);
    $("#txt", v).onclick = () => { $("#ans", v).classList.remove("hidden"); $("#txt", v).remove(); };
    $$(".opt", v).forEach(b => b.onclick = () => {
      if (b.disabled) return; const ok = opts[+b.dataset.k].ok; if (ok) right++;
      $$(".opt", v).forEach((y, k) => { y.disabled = true; if (opts[k].ok) y.classList.add("ok"); else if (y === b) y.classList.add("no"); else y.classList.add("dim"); });
      $("#ans", v).classList.remove("hidden"); const t = $("#txt", v); if (t) t.remove();
      $("#fb", v).innerHTML = after ? after(x, ok) : "";
      if (deck) { srsGrade(deck, mode, x.id, ok); save(); }
      const n = $("#nx", v); n.classList.remove("hidden"); n.onclick = () => { i++; draw(); };
    });
  };
  draw();
}

    v.innerHTML = `<p class="muted small" style="margin:2px">${i + 1} / 10</p><div class="vc"><div class="pr">${x.hint}</div><button class="bigspk" id="play">${SPK}</button><div class="ans hidden" id="ans"><div class="a1">${esc(x.ans)}</div><div class="a3">${esc(x.say)}</div></div></div>
    <input class="input" id="in" inputmode="decimal" style="margin-top:14px;text-align:center;font-size:20px;font-weight:700" autocomplete="off"><button class="btn petrol" id="chk">Prüfen</button><button class="btn primary hidden" id="nx">Weiter</button>`;
    const play = () => { if (!speakSlow(x.say)) { const a_ = $("#ans", v); if (a_) a_.classList.remove("hidden"); }; };
    $("#play", v).onclick = play; setTimeout(play, 200);
    const inp = $("#in", v);
    const check = () => { if (inp.disabled) return; inp.disabled = true; const ok = norm(inp.value) === norm(x.ans); if (ok) right++; inp.classList.add(ok ? "ok" : "no"); $("#chk", v).remove(); $("#ans", v).classList.remove("hidden"); logActivity(); const n = $("#nx", v); n.classList.remove("hidden"); n.onclick = () => { i++; draw(); }; };
    $("#chk", v).onclick = check; inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); inp.disabled ? $("#nx", v).click() : check(); } };
  };
  draw();
});
route("/botschaft/buchstabieren", () => {
  const v = shell({ title: "Buchstabieren", back: "/interview", tab: "pruefung" });
  const me = myData();
  const words = ["Hinkson", "Damian", "Rita", "Dabrianna", "Isis", "Archer", "Barbados", "Bridgetown", "Müllheim", "Weil", "Rhein", "Geffelbach", "Cleveland", "Wendy", "Landwirt", "Bairds"].concat(me.email ? [me.email] : []);
  const letters = "abcdefghijklmnopqrstuvwxyzäöüß".split("");
  v.innerHTML = `<div class="h2" style="margin-top:6px">Das Alphabet</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">${letters.map(l => `<button class="pc" data-say="${esc(DE_LETTERS[l])}" style="min-height:48px;text-align:center"><b>${l.toUpperCase()}</b><br><span class="muted small">${esc(DE_LETTERS[l])}</span></button>`).join("")}</div>
  <div class="h2">Üben</div><div class="menu"><button class="item" id="hear"><span class="ic amber">👂</span><span class="tx"><span class="tt">Hören und schreiben</span><span class="ss">A name is spelled to you, type the word</span></span></button><button class="item" id="say"><span class="ic amber">🗣</span><span class="tx"><span class="tt">Selbst buchstabieren</span><span class="ss">Spell a name out loud, then check</span></span></button></div>`;
  const run = mode => {
    const q = shuffle(words).slice(0, 8); let i = 0, right = 0;
    const draw = () => {
      if (i >= q.length) { v.innerHTML = `<div class="result"><div class="pct pass">${mode === "hear" ? right + "/" + q.length : "✓"}</div></div><div class="row2"><button class="btn ghost" data-go="/interview">Zurück</button><button class="btn primary" id="ag">Nochmal</button></div>`; $("#ag", v).onclick = () => render(); return; }
      const w = q[i], sp = deSpell(w), spSay = sp.replace(/ – /g, ", ");
      if (mode === "hear") {
        v.innerHTML = `<p class="muted small" style="margin:2px">${i + 1} / ${q.length}</p><div class="vc"><div class="pr">Hör zu und schreib das Wort.</div><button class="bigspk" id="play">${SPK}</button><div class="ans hidden" id="ans"><div class="a1">${esc(w)}</div><div class="a3">${esc(sp)}</div></div></div><input class="input" id="in" autocapitalize="off" spellcheck="false" style="margin-top:14px;text-align:center;font-size:20px;font-weight:700"><button class="btn petrol" id="chk">Prüfen</button><button class="btn primary hidden" id="nx">Weiter</button>`;
        const play = () => { if (!speak(spSay, .7)) { const a_ = $("#ans", v); if (a_) a_.classList.remove("hidden"); }; }; $("#play", v).onclick = play; setTimeout(play, 200);
        const inp = $("#in", v), check = () => { if (inp.disabled) return; inp.disabled = true; const ok = inp.value.trim().toLowerCase() === w.toLowerCase(); if (ok) right++; inp.classList.add(ok ? "ok" : "no"); $("#chk", v).remove(); $("#ans", v).classList.remove("hidden"); logActivity(); const n = $("#nx", v); n.classList.remove("hidden"); n.onclick = () => { i++; draw(); }; };
        $("#chk", v).onclick = check; inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); inp.disabled ? $("#nx", v).click() : check(); } };
      } else {
        v.innerHTML = `<p class="muted small" style="margin:2px">${i + 1} / ${q.length}</p><div class="vc"><div class="pr">Buchstabieren Sie bitte:</div><div class="w ${w.length > 12 ? "sm" : ""}">${esc(w)}</div><div class="ans hidden" id="ans"><div class="a1" style="font-size:19px">${esc(sp)}</div></div></div><button class="btn petrol" id="sh">Prüfen</button><button class="btn primary hidden" id="nx">Weiter</button>`;
        $("#sh", v).onclick = () => { $("#ans", v).classList.remove("hidden"); $("#sh", v).remove(); speak(spSay, .75); logActivity(); const n = $("#nx", v); n.classList.remove("hidden"); n.onclick = () => { i++; draw(); }; };
      }
    };
    draw();
  };
  $("#hear", v).onclick = () => run("hear"); $("#say", v).onclick = () => run("say");
});

route("/botschaft/sim", () => {
  if (!ANTRAG_ON) return go("/");
  const v = shell({ title: "Simulation", back: "/interview", tab: "pruefung" });
  const items = ivItems(), A = window.ANTRAG, byQ = q => items[ivIdx(q)], act = de => ({ t: "act", x: A.anwPick(A.anw.find(a => a.base === de)) });
  const steps = [
    { t: "say", de: "Guten Tag! Kommen Sie bitte zum Schalter drei." }, act("Nehmen Sie bitte Platz."), act("Geben Sie mir bitte Ihren Reisepass."),
    ...["Wie heißen Sie?", "Buchstabieren Sie bitte Ihren Nachnamen.", "Wie alt sind Sie?", "Wie ist Ihr Geburtsdatum?", "Woher kommen Sie?", "Wo wohnen Sie?", "Welche Sprachen sprechen Sie?"].map(q => ({ t: "q", x: byQ(q) })),
    { t: "fast", x: byQ("Wie heißt Ihre Frau?") },
    ...["Wo wohnt Ihre Frau?", "Was arbeitet Ihre Frau in Deutschland?", "Seit wann sind Sie verheiratet?", "Wann haben Sie geheiratet?"].map(q => ({ t: "q", x: byQ(q) })),
    act("Haben Sie ein Foto von Ihrer Frau?"),
    ...["Was sind Sie von Beruf?", "Warum möchten Sie nach Deutschland reisen?", "Was machen Sie in Deutschland?", "Lernen Sie Deutsch?", "Warum lernen Sie Deutsch?", "Was machen Sie gerne in Ihrer Freizeit?", "Wann fliegen Sie nach Deutschland?", "Wie ist Ihre Telefonnummer?"].map(q => ({ t: "q", x: byQ(q) })),
    act("Unterschreiben Sie bitte hier."), act("Schauen Sie bitte in die Kamera."), act("Sie können jetzt gehen.")
  ].filter(s => s.t === "say" || s.x);
  let i = 0; const res = [];
  const head = () => `<p class="muted small" style="margin:2px">Schritt ${i + 1} / ${steps.length}</p>`;
  const officer = (de, rate = .85) => `<div class="card"><span class="kind">Beamter</span><div style="display:flex;gap:10px;align-items:flex-start;margin-top:4px"><button class="spk" id="rep" aria-label="Nochmal hören">${SPK}</button><p class="qbig hidq" id="qt" style="margin:0">Hör zu.</p></div><button class="btn ghost" id="txt" style="width:auto;padding:7px 12px;margin-top:10px">Text zeigen</button></div>`;
  const wireOfficer = (de, rate = .85) => { const p = () => { if (!speak(de, rate)) showTxt(de); }; $("#rep", v).onclick = () => speak(de, .8); setTimeout(p, 250); $("#txt", v).onclick = () => showTxt(de); };
  const showTxt = de => { const q = $("#qt", v); if (q) { q.textContent = de; q.classList.remove("hidq"); } const t = $("#txt", v); if (t) t.remove(); };
  const next = ok => { if (ok != null) res.push({ s: steps[i], ok }); i++; draw(); window.scrollTo(0, 0); };
  function draw() {
    hush();
    if (i >= steps.length) {
      const r = res.filter(x => x.ok).length, miss = res.filter(x => !x.ok);
      v.innerHTML = `<div class="result"><div class="pct ${r >= res.length * .8 ? "pass" : ""}">${r}/${res.length}</div><div class="lbl">Gespräch beendet</div><div class="sub">${r >= res.length * .8 ? "You'd come across well at the counter." : "Practise the steps below, then run it again."}</div></div>` +
        miss.map(m => `<div class="rev no"><div class="rq">${esc(m.s.x.q || m.s.x.de)}</div><div class="ra">${esc(m.s.x.a || m.s.x.en)}</div></div>`).join("") +
        `<div class="row2"><button class="btn ghost" data-go="/interview">Übersicht</button><button class="btn primary" id="ag">Nochmal</button></div>`;
      $("#ag", v).onclick = () => render(); return;
    }
    const s = steps[i];
    if (s.t === "say") { v.innerHTML = head() + officer(s.de) + `<button class="btn primary" id="nx">Guten Tag!</button>`; wireOfficer(s.de); $("#nx", v).onclick = () => { speak("Guten Tag!"); next(null); }; return; }
    if (s.t === "act") {
      const opts = shuffle([{ l: s.x.en, ok: true }].concat(shuffle(A.anw.filter(a => a.id !== s.x.id && !((A.anwClash || {})[s.x.id] || []).includes(a.id))).slice(0, 2).map(a => ({ l: a.en, ok: false }))));
      v.innerHTML = head() + officer(s.x.de) + `<p class="prompt" style="margin-top:14px"><small>Was tun Sie?</small></p><div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.l)}</button>`).join("")}</div><div id="fb"></div><button class="btn primary hidden" id="nx">Weiter</button>`;
      wireOfficer(s.x.de);
      $$(".opt", v).forEach(b => b.onclick = () => { if (b.disabled) return; const ok = opts[+b.dataset.k].ok; $$(".opt", v).forEach((y, k) => { y.disabled = true; if (opts[k].ok) y.classList.add("ok"); else if (y === b) y.classList.add("no"); else y.classList.add("dim"); }); showTxt(s.x.de); if (s.x.say) { $("#fb", v).innerHTML = `<div class="fb"><b>Sie sagen:</b> ${esc(s.x.say)}</div>`; setTimeout(() => speak(s.x.say), 300); } const n = $("#nx", v); n.classList.remove("hidden"); n.onclick = () => next(ok); });
      return;
    }
    if (s.t === "fast") {
      const R = A.rett, good = R.find(r => r.de.startsWith("Bitte sprechen")), opts = shuffle([good, R.find(r => r.de === "Bitte schön."), R.find(r => r.de === "Auf Wiedersehen.")]);
      v.innerHTML = head() + officer(s.x.q, 1.6) + `<p class="prompt" style="margin-top:14px"><small>Der Beamte spricht sehr schnell. Was sagen Sie?</small></p><div class="opts">${opts.map(o => `<button class="opt" data-de="${esc(o.de)}">${esc(o.de)}</button>`).join("")}</div>`;
      wireOfficer(s.x.q, 1.6);
      $$(".opt", v).forEach(b => b.onclick = () => { const ok = b.dataset.de === good.de; res.push({ s: { x: { de: "Der Beamte spricht zu schnell", en: good.de } }, ok }); speak(good.de); setTimeout(() => { steps[i] = { t: "q", x: s.x }; draw(); }, ok ? 1800 : 2600); $$(".opt", v).forEach(y => { y.disabled = true; y.classList.add(y.dataset.de === good.de ? "ok" : y === b ? "no" : "dim"); }); });
      return;
    }
    v.innerHTML = head() + officer(s.x.q) + `<textarea class="ta" style="min-height:70px;margin-top:12px" placeholder="Answer out loud, or type it"></textarea><button class="btn petrol" id="rv">Antwort zeigen</button><div id="out"></div>`;
    wireOfficer(s.x.q);
    $("#rv", v).onclick = () => {
      $("#rv", v).remove(); showTxt(s.x.q);
      $("#out", v).innerHTML = `<div class="corr"><h4>Ihre Antwort</h4>${esc(s.x.a)} ${spkBtn(s.x.a.replace(/ – /g, ", "))}</div>${s.x.x ? `<div class="task">${esc(s.x.x)}</div>` : ""}<div class="row2"><button class="btn bad" data-ok="0">Nochmal üben</button><button class="btn good" data-ok="1">Konnte ich</button></div>`;
      $$("[data-ok]", v).forEach(b => b.onclick = () => { const ok = b.dataset.ok === "1"; srsGrade("antrag", "q", s.x.id, ok); save(); next(ok); });
    };
  }
  draw();
});
