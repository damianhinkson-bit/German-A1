<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#125a5f"><title>Deutsch A1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch A1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Goethe A1 trainer: grammar, Lesen, Schreiben, Wortschatz, Atome and the embassy interview. Works offline.">


<style>@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(bricolage.woff2) format("woff2-variations"),url(bricolage.woff2) format("woff2");}
:root{
  --bg:#eef4f2; --surface:#ffffff; --surface-2:#e3ecea; --ink:#10292b; --muted:#56706f; --line:#cfdcd9;
  --petrol:#125a5f; --petrol-deep:#0c3438; --petrol-soft:#1f7a80; --on-petrol:#ffffff;
  --amber:#f2a33a; --amber-ink:#3b2503; --amber-tint:#fcebcf;
  --good:#1f8a5e; --good-tint:#dcf1e6; --bad:#c9463a; --bad-tint:#f8e0dc;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 0 rgba(12,52,56,.06), 0 8px 24px rgba(12,52,56,.07);
  --font:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a2124; --surface:#0f2e33; --surface-2:#153a40; --ink:#e4efed; --muted:#93b0ad; --line:#21464c;
    --petrol:#2a8a90; --petrol-deep:#071a1c; --petrol-soft:#56b3b8; --on-petrol:#ffffff;
    --amber:#f2a33a; --amber-ink:#2b1a02; --amber-tint:#3a2c12;
    --good:#4cc08c; --good-tint:#133a2a; --bad:#ef7a6c; --bad-tint:#43201c;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0a2124; --surface:#0f2e33; --surface-2:#153a40; --ink:#e4efed; --muted:#93b0ad; --line:#21464c;
  --petrol:#2a8a90; --petrol-deep:#071a1c; --petrol-soft:#56b3b8; --on-petrol:#ffffff;
  --amber:#f2a33a; --amber-ink:#2b1a02; --amber-tint:#3a2c12;
  --good:#4cc08c; --good-tint:#133a2a; --bad:#ef7a6c; --bad-tint:#43201c;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:12px 16px;min-height:56px}
.hdr .back{display:inline-flex;align-items:center;gap:4px;color:var(--petrol-soft);font-weight:700;font-size:15px;padding:6px 8px 6px 2px}
.hdr h1{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .right{font-variant-numeric:tabular-nums;font-weight:800}
.view{padding:4px 16px 24px}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs-in{display:flex;width:100%;max-width:600px}
.tab{text-decoration:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:700}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--petrol-soft)}
.tab[aria-current="page"] svg{stroke:var(--amber)}
.tab .badge{position:absolute;margin-left:22px;margin-top:-2px;background:var(--amber);color:var(--amber-ink);font-size:10.5px;font-weight:800;border-radius:99px;padding:0 6px;line-height:17px}
.tab-ic{position:relative;display:flex}

/* ---------- home ---------- */
.today{padding:10px 2px 6px}
.today .date{color:var(--muted);font-weight:600;font-size:15px}
.big-due{display:flex;align-items:flex-end;gap:14px;margin:4px 0 2px}
.big-due .n{font-size:92px;line-height:.86;font-weight:800;letter-spacing:-.05em;color:var(--petrol-soft)}
.big-due .n.zero{color:var(--good)}
.big-due .l{font-size:19px;font-weight:700;line-height:1.2;padding-bottom:6px}
.due-list{margin:18px 0 6px;border-top:1px solid var(--line)}
.due-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line)}
.due-row .t{flex:1;font-weight:700;font-size:16px}
.due-row .s{display:block;color:var(--muted);font-weight:500;font-size:13.5px}
.due-row .c{font-weight:800;font-variant-numeric:tabular-nums;min-width:36px;text-align:right;font-size:18px}
.due-row .c.hot{color:var(--amber)}
.due-row .chev{color:var(--muted);font-size:20px}
.strip{display:flex;gap:10px;margin:22px 0 6px}
.strip > div{flex:1;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow)}
.strip b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.strip span{color:var(--muted);font-size:13px;font-weight:600}
.h2{font-size:15px;font-weight:800;margin:26px 2px 10px;color:var(--muted)}
.meter{padding:9px 2px}
.meter .top{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.meter .top span{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--petrol-soft);border-radius:99px;transition:width .4s}
.weak{display:flex;flex-wrap:wrap;gap:8px}
.weak button{background:var(--bad-tint);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.weak button span{color:var(--muted);font-weight:600;margin-left:6px}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* ---------- lists / menus ---------- */
.menu{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin:10px 0}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .ic{width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;color:var(--petrol-soft);font-size:15px}
.item .ic.amber{background:var(--amber);color:var(--amber-ink)}
.item .tx{flex:1;min-width:0}
.item .tt{font-weight:700;font-size:16px;display:block}
.item .ss{color:var(--muted);font-size:13.5px;display:block}
.item .rt{color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .rt.good{color:var(--good)}
.item[disabled]{opacity:.5;cursor:default}
.hero-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--petrol);color:var(--on-petrol);border-radius:var(--r-lg);padding:18px;margin:8px 0 4px}
.hero-btn .ic{font-size:30px;font-weight:800;width:40px;text-align:center}
.hero-btn .tt{font-weight:800;font-size:18px;display:block}
.hero-btn .ss{opacity:.8;font-size:14px;display:block}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.hard button[aria-pressed="true"][data-v="hard"]{background:var(--bad);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:700;font-size:13.5px}
.chip span{color:var(--muted);font-weight:600;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.chip[aria-pressed="true"] span{color:inherit;opacity:.75}
.note{background:var(--amber-tint);border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:12px 0}

/* ---------- quiz ---------- */
.stats{display:flex;gap:8px;margin:4px 0 12px}
.stats div{flex:1;background:var(--surface);border-radius:12px;padding:8px;text-align:center;box-shadow:var(--shadow)}
.stats b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stats div:first-child b{color:var(--amber)}
.stats span{font-size:11.5px;color:var(--muted);font-weight:700}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 18px}
.kind{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--petrol-soft);margin-bottom:10px}
.kind.rule{background:var(--amber-tint);color:var(--ink)}
.kind.trigger{background:#d5eef3;color:#0d4a55}
.kind.contrast{background:#e6dcf7;color:#3d2a66}
.q{font-size:21px;font-weight:700;line-height:1.3;margin:0 0 4px}
.q em{font-style:normal;color:var(--petrol-soft);font-weight:800}
.q .blank{color:var(--amber);border-bottom:2px dashed var(--amber);padding:0 .25em}
.tr{color:var(--muted);font-style:italic;margin:4px 0 0}
.opts{display:grid;gap:9px;margin-top:16px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 15px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px}
.opt .m{margin-left:auto;font-weight:800}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-tint)}
.opt.no{border-color:var(--bad);background:var(--bad-tint)}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-left:3px solid var(--amber);background:var(--bg);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px}
.fb b{color:var(--petrol-soft)}
.fb .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fb .de{font-weight:800}
.fb .ph{color:var(--muted);font-size:13.5px;font-style:italic}
.say{display:inline-flex;align-items:center;gap:6px;background:var(--petrol);color:var(--on-petrol);border-radius:10px;padding:7px 12px;font-weight:700;font-size:14px;margin-top:8px}
.say svg,.spk svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:block;width:100%;border-radius:var(--r-md);padding:15px;font-weight:800;font-size:16px;text-align:center;margin-top:14px}
.btn.primary{background:var(--amber);color:var(--amber-ink)}
.btn.petrol{background:var(--petrol);color:var(--on-petrol)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}
.row .btn{margin-top:0}
.row2{display:flex;gap:10px;margin-top:14px}
.row2 .btn{margin-top:0}

/* results */
.result{text-align:center;padding:10px 0}
.result .pct{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--petrol-soft)}
.result .pct.pass{color:var(--good)}
.result .lbl{font-weight:700;font-size:18px;margin-top:6px}
.result .sub{color:var(--muted)}
.breakdown{display:flex;gap:8px;margin:16px 0}
.breakdown div{flex:1;background:var(--surface);border-radius:12px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.breakdown b{display:block;font-size:20px;font-weight:800}
.breakdown b.low{color:var(--bad)}
.breakdown span{font-size:12px;color:var(--muted);font-weight:700}
.rev{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-top:8px;border-left:4px solid var(--good);text-align:left}
.rev.no{border-left-color:var(--bad)}
.rev .rq{font-weight:700}
.rev .ra{color:var(--muted);font-size:14px;margin-top:4px}
.rev .ra b{color:var(--ink)}
.rev .rx{font-size:14px;margin-top:6px}
.kw{background:var(--amber-tint);border-radius:4px;padding:0 3px;font-weight:700}

/* ---------- exam ---------- */
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--petrol);color:var(--on-petrol);border-radius:10px;padding:4px 10px;font-size:16px}
.timer.warn{background:var(--bad)}
.teil{display:flex;align-items:center;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.teil .tag{background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:13px;padding:4px 11px;border-radius:99px}
.teil .sub{color:var(--muted);font-weight:600;font-size:14px}
.teil .qn{margin-left:auto;color:var(--muted);font-weight:700;font-size:14px}
.text{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.text .from{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--petrol-soft);border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
.text .body{white-space:pre-wrap;font-size:16px}
.sign{background:var(--petrol-deep);color:#fff;border-radius:var(--r-md);text-align:center;padding:22px 16px;margin-bottom:14px;position:relative}
.sign .i{font-size:26px}
.sign .body{white-space:pre-wrap;font-size:19px;font-weight:700;margin-top:6px}
.sign .spk{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.15);color:#fff}
.spk{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--petrol-soft);display:inline-grid;place-items:center;flex:0 0 auto}
.prompt{font-weight:700;font-size:17px;margin:4px 2px 12px}
.prompt small{display:block;color:var(--amber);font-weight:800;font-size:13px}
.ad{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px;margin-bottom:10px;font-size:15px}
.ad .b{width:28px;height:28px;flex:0 0 auto;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:800}
.ad.sel{border-color:var(--petrol-soft)}
.ad.sel .b{background:var(--amber);color:var(--amber-ink)}
.rf{display:flex;gap:10px}
.rf button{flex:1;padding:15px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px}
.rf button.sel{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:18px 0 4px}
.dot{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-weight:800;color:var(--muted)}
.dot.a{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.dot.c{outline:2px solid var(--amber);outline-offset:1px}

/* forms (Schreiben) */
.field{margin-top:12px}
.field label{display:block;font-weight:700;font-size:14px;color:var(--petrol-soft);margin-bottom:5px}
.input,.ta{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;font-size:16px;outline:none}
.input:focus,.ta:focus{border-color:var(--petrol-soft)}
.input.ok{border-color:var(--good);background:var(--good-tint)}
.input.no{border-color:var(--bad);background:var(--bad-tint)}
.pre{background:var(--surface-2);border-radius:var(--r-sm);padding:11px 12px;color:var(--muted)}
.ta{min-height:150px;resize:vertical;line-height:1.55}
.wc{text-align:right;color:var(--muted);font-size:13px;margin-top:4px}
.points{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.points span{background:var(--amber-tint);border-radius:99px;padding:5px 11px;font-size:13.5px;font-weight:700}
.model{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;margin-top:12px;white-space:pre-wrap;font-size:15px}
.model h4,.check h4{margin:0 0 6px;font-size:13.5px;color:var(--petrol-soft)}
.check label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--petrol)}
.fres{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fres:last-child{border-bottom:none}
.fres .mk{width:22px;height:22px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;background:var(--good)}
.fres .mk.no{background:var(--bad)}
.fres .l{font-size:13px;color:var(--muted);font-weight:700}
.fres s{color:var(--bad)}
.fres .r{color:var(--good);font-weight:700}

/* ---------- vocab ---------- */
.vc{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);min-height:220px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.vc .th{position:absolute;top:12px;left:0;right:0;font-size:12.5px;color:var(--muted);font-weight:700}
.vc .pr{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:6px}
.vc .w{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.vc .w.sm{font-size:27px}
.vc .ans{margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--line);width:100%}
.vc .ans .a1{font-size:24px;font-weight:800}
.vc .ans .a2{color:var(--petrol-soft);font-weight:700;font-size:17px}
.vc .ans .a3{color:var(--muted);font-size:14px;margin-top:4px}
.vc .ans .a4{font-size:14.5px;margin-top:8px;font-style:italic}
.vc .spk{position:absolute;top:10px;right:10px}
.art{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.art button{padding:17px 0;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:800}
.art button.ok{background:var(--good);border-color:var(--good);color:#fff}
.art button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.art button.rv{border-color:var(--good);color:var(--good)}
.bigspk{width:92px;height:92px;border-radius:50%;background:var(--petrol);color:#fff;display:grid;place-items:center}
.bigspk svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.pc{min-height:52px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;line-height:1.25}
.pc.de{font-weight:800}
.pc.sel{border-color:var(--amber);background:var(--amber-tint)}
.pc.ok{border-color:var(--good);background:var(--good-tint);opacity:.7}
.pc.no{border-color:var(--bad);background:var(--bad-tint);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.flip{perspective:1200px}
.flip .inner{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flip .inner.on{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .back{transform:rotateY(180deg);background:var(--petrol);color:var(--on-petrol)}
.flip .back .pr,.flip .back .th{color:inherit;opacity:.75}
.fsim .fl{padding:13px 14px;border-bottom:1px solid var(--line)}
.fsim .fl:last-child{border-bottom:none}
.fsim .fl.done{background:var(--good-tint)}
.fsim .lb{font-weight:800;display:flex;align-items:center;gap:8px}
.fsim .val{color:var(--muted);font-size:14px;margin-top:4px}
.fsim .val b{color:var(--good)}
.fsim .fo{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.fsim .fo button{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600}
.fsim .fo button.no{border-color:var(--bad);background:var(--bad-tint)}
.scene{background:var(--amber-tint);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;margin:10px 0}

/* ---------- atoms ---------- */
.boxes{display:flex;gap:6px;margin:8px 0 4px}
.boxes div{flex:1;text-align:center;background:var(--surface);border-radius:12px;padding:8px 4px;box-shadow:var(--shadow)}
.boxes b{display:block;font-size:20px;font-weight:800}
.boxes span{font-size:11.5px;color:var(--muted);font-weight:700}
.fp{background:var(--bad-tint);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;margin-top:10px}
.fp h4,.corr h4{margin:0 0 4px;font-size:13.5px}
.corr{background:var(--good-tint);border-radius:var(--r-md);padding:12px 14px;margin-top:10px;font-size:16px}
.corr ol{margin:4px 0 0;padding-left:20px}
.corr li{margin:6px 0}
.corr li small{display:block;color:var(--muted);font-size:13px}
.task{background:var(--surface-2);border-radius:var(--r-md);padding:10px 14px;font-size:14.5px;margin-top:10px}
.task b{color:var(--petrol-soft)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:90vw}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--good)}
.sw.on i{left:23px}
#antragSw{border-top:1px solid var(--line);margin-top:12px}
.qbig{font-size:23px;font-weight:800;line-height:1.25;margin:4px 0 0}
.hidq{color:var(--muted);font-style:italic}
